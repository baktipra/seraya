name: Temporary mobile hotfix formatter

on:
  push:
    branches:
      - hotfix/mobile-invitation-workspace-p0

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/mobile-invitation-workspace-p0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/invitation-mobile-recovery.css src/app/layout.tsx tests/server/invitation-mobile-recovery.test.ts
          git commit -m "Format mobile invitation hotfix"
          git push origin HEAD:hotfix/mobile-invitation-workspace-p0
