name: Release A guided-form hydration marker

on:
  push:
    branches:
      - agent/release-a-flagship-experience

permissions:
  contents: write

jobs:
  add-hydration-marker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-a-flagship-experience

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add explicit interactive readiness marker
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/projects/project-setup-form.tsx')
          content = path.read_text()
          content = content.replace(
              "import { useActionState, useEffect, useMemo, useState } from 'react';",
              "import { useActionState, useEffect, useMemo, useRef, useState } from 'react';",
              1,
          )
          content = content.replace(
              "  const [templateKey, setTemplateKey] = useState<InvitationTemplateKey>('roselle');\n  const errors = state.fieldErrors ?? {};",
              "  const [templateKey, setTemplateKey] = useState<InvitationTemplateKey>('roselle');\n  const formRef = useRef<HTMLFormElement>(null);\n  const errors = state.fieldErrors ?? {};",
              1,
          )
          content = content.replace(
              "  useEffect(() => {\n    if (state.status !== 'error') return undefined;",
              "  useEffect(() => {\n    formRef.current?.setAttribute('data-interactive', 'true');\n  }, []);\n\n  useEffect(() => {\n    if (state.status !== 'error') return undefined;",
              1,
          )
          content = content.replace(
              '<form action={formAction} className="mt-9 flex flex-1 flex-col" noValidate>',
              '<form\n          ref={formRef}\n          action={formAction}\n          className="mt-9 flex flex-1 flex-col"\n          data-guided-project-setup="true"\n          data-interactive="false"\n          noValidate\n        >',
              1,
          )
          path.write_text(content)
          PY

      - name: Format guided form
        run: npx prettier --write src/components/projects/project-setup-form.tsx

      - name: Commit hydration marker
        run: |
          if git diff --quiet; then
            echo 'Hydration marker already present.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/projects/project-setup-form.tsx
          git commit -m 'Expose guided-form interactive readiness'
          git push origin HEAD:agent/release-a-flagship-experience
