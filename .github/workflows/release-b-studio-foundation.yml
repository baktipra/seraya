name: Release B studio foundation

on:
  pull_request:
    branches:
      - agent/release-a-flagship-experience
    paths:
      - '.github/workflows/release-b-studio-foundation.yml'
      - 'src/components/personal-invitation/**'
      - 'src/components/projects/invitation-editor.tsx'
      - 'src/components/projects/invitation-editor-live-preview.tsx'
      - 'src/components/projects/invitation-editor-live-preview.module.css'
      - 'src/components/projects/invitation-editor-status-header.tsx'
      - 'src/components/projects/invitation-editor-workspace.tsx'
      - 'src/modules/invitation-editor/**'
      - 'tests/server/invitation-editor-ui.test.tsx'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-b-studio-foundation.yml'
      - 'src/components/personal-invitation/**'
      - 'src/components/projects/invitation-editor.tsx'
      - 'src/components/projects/invitation-editor-live-preview.tsx'
      - 'src/components/projects/invitation-editor-live-preview.module.css'
      - 'src/components/projects/invitation-editor-status-header.tsx'
      - 'src/components/projects/invitation-editor-workspace.tsx'
      - 'src/modules/invitation-editor/**'
      - 'tests/server/invitation-editor-ui.test.tsx'

permissions:
  contents: read

jobs:
  studio-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Release B formatting
        run: |
          npx prettier --check \
            .github/workflows/release-b-studio-foundation.yml \
            src/components/personal-invitation/personal-guest-rsvp.tsx \
            src/components/personal-invitation/personal-guestbook.tsx \
            src/components/projects/invitation-editor.tsx \
            src/components/projects/invitation-editor-live-preview.tsx \
            src/components/projects/invitation-editor-live-preview.module.css \
            src/components/projects/invitation-editor-status-header.tsx \
            src/components/projects/invitation-editor-workspace.tsx \
            src/modules/invitation-editor/editor-chapter-registry.ts \
            src/modules/invitation-editor/editor-truth-state.ts \
            src/modules/invitation-editor/__tests__/editor-foundation.test.ts \
            src/modules/invitation-editor/__tests__/editor-preview-modes.test.tsx

      - name: Lint Release B files
        run: |
          npx eslint \
            src/components/personal-invitation/personal-guest-rsvp.tsx \
            src/components/personal-invitation/personal-guestbook.tsx \
            src/components/projects/invitation-editor.tsx \
            src/components/projects/invitation-editor-live-preview.tsx \
            src/components/projects/invitation-editor-status-header.tsx \
            src/components/projects/invitation-editor-workspace.tsx \
            src/modules/invitation-editor/editor-chapter-registry.ts \
            src/modules/invitation-editor/editor-truth-state.ts \
            src/modules/invitation-editor/__tests__/editor-foundation.test.ts \
            src/modules/invitation-editor/__tests__/editor-preview-modes.test.tsx

      - name: Run focused studio contracts
        run: |
          npm test -- \
            src/modules/invitation-editor/__tests__/editor-foundation.test.ts \
            src/modules/invitation-editor/__tests__/editor-preview-modes.test.tsx \
            tests/server/invitation-editor-ui.test.tsx

      - name: Build production application
        run: |
          set -o pipefail
          npm run build 2>&1 | tee release-b-build.log

      - name: Upload production build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-b-build-log
          path: release-b-build.log
          if-no-files-found: error
          retention-days: 3
