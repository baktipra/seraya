name: Release B apply studio foundation

on:
  pull_request:
    branches:
      - agent/release-a-flagship-experience
  push:
    branches:
      - agent/release-b-create-to-publish

permissions:
  contents: write

jobs:
  apply:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message != 'Apply Release B studio foundation') ||
      (github.event_name == 'pull_request' && github.head_ref == 'agent/release-b-create-to-publish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-b-create-to-publish
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact editor integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/projects/invitation-editor.tsx')
          source = path.read_text()

          replacements = [
              (
                  "  Badge,\n",
                  "",
              ),
              (
                  "import type { ProjectPublishEligibility } from '@/modules/payments/payment.types';\n",
                  "import { getInvitationEditorTruthState } from '@/modules/invitation-editor/editor-truth-state';\nimport type { ProjectPublishEligibility } from '@/modules/payments/payment.types';\n",
              ),
              (
                  "import { InvitationEditorLivePreview } from './invitation-editor-live-preview';\n",
                  "import { InvitationEditorLivePreview } from './invitation-editor-live-preview';\nimport { InvitationEditorStatusHeader } from './invitation-editor-status-header';\n",
              ),
              (
                  "  const sectionStatuses = getInvitationEditorSectionStatuses(draft, state.fieldErrors);\n",
                  "  const sectionStatuses = getInvitationEditorSectionStatuses(content, state.fieldErrors);\n",
              ),
              (
                  "  const saveStatus = getInvitationEditorSaveStatus({\n    actionStatus: state.status,\n    hasSaved,\n    isDirty,\n    isPending,\n  });\n",
                  "  const saveStatus = getInvitationEditorSaveStatus({\n    actionStatus: state.status,\n    hasSaved,\n    isDirty,\n    isPending,\n  });\n  const truthState = getInvitationEditorTruthState({\n    actionStatus: state.status,\n    hasSaved,\n    isDirty,\n    isPending,\n    readiness: workspaceReadiness,\n  });\n",
              ),
              (
                  "        <div className=\"bg-seraya-brand-soft rounded-t-[var(--seraya-radius-lg)] px-5 py-8 sm:px-8 sm:py-10\">\n          <Badge variant={workspaceReadiness.invitation.hasPublishedSnapshot ? 'success' : 'brand'}>\n            {confidenceStatus.badge}\n          </Badge>\n          <p className=\"text-seraya-text-secondary mt-5 text-sm font-semibold\">\n            {workspaceReadiness.identity.coupleLabel}\n          </p>\n          <h1\n            className=\"seraya-display-md mt-3 max-w-2xl text-[clamp(2.25rem,5vw,3.5rem)]\"\n            id=\"invitation-editor-title\"\n          >\n            {confidenceStatus.title}\n          </h1>\n          <p className=\"text-seraya-text-secondary mt-4 max-w-2xl text-base leading-7\">\n            {confidenceStatus.description}\n          </p>\n        </div>\n",
                  "        <InvitationEditorStatusHeader\n          coupleLabel={workspaceReadiness.identity.coupleLabel}\n          projectId={projectId}\n          templateLabel={content.templateKey}\n          truth={truthState}\n          workspaceDescription={confidenceStatus.description}\n          workspaceTitle={confidenceStatus.title}\n        />\n",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count == 0 and new in source:
                  continue
              if count != 1:
                  raise SystemExit(f'Expected one exact match, found {count}: {old[:90]!r}')
              source = source.replace(old, new)

          path.write_text(source)
          PY

      - name: Format changed source
        run: |
          npx prettier --write \
            src/components/projects/invitation-editor.tsx \
            src/components/projects/invitation-editor-status-header.tsx \
            src/components/projects/invitation-editor-workspace.tsx \
            src/modules/invitation-editor/editor-chapter-registry.ts \
            src/modules/invitation-editor/editor-truth-state.ts \
            src/modules/invitation-editor/__tests__/editor-foundation.test.ts

      - name: Commit integrated foundation
        run: |
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'seraya-release-b-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/components/projects/invitation-editor.tsx \
            src/components/projects/invitation-editor-status-header.tsx \
            src/components/projects/invitation-editor-workspace.tsx \
            src/modules/invitation-editor/editor-chapter-registry.ts \
            src/modules/invitation-editor/editor-truth-state.ts \
            src/modules/invitation-editor/__tests__/editor-foundation.test.ts
          git commit -m 'Apply Release B studio foundation'
          git push origin HEAD:agent/release-b-create-to-publish
