name: Owner Dashboard Cognitive Compression V1 validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/app/layout.tsx'
      - 'src/app/workspace-anatomy.css'
      - 'src/app/(dashboard)/dashboard/[projectId]/delivery/page.tsx'
      - 'src/components/dashboard/dashboard-shell.tsx'
      - 'src/components/dashboard/dashboard-shell.module.css'
      - 'src/components/dashboard/project-navigation.tsx'
      - 'src/components/dashboard/project-navigation.module.css'
      - 'src/components/projects/project-overview-bootstrap.tsx'
      - 'src/components/projects/project-overview-bootstrap.module.css'
      - 'src/components/projects/invitation-task-workspace.tsx'
      - 'src/components/projects/invitation-task-workspace.module.css'
      - 'tests/unit/owner-workspace-radical-simplicity-v2.test.ts'
      - 'tests/e2e/owner-workspace-radical-simplicity-v2.spec.ts'
      - 'tests/e2e/fixture-app/app/owner-workspace-radical-simplicity-v2/**'
      - 'tests/e2e/fixture-app/app/dashboard/editorial-v3/**'
      - 'playwright.owner-workspace-radical-simplicity-v2.config.ts'
      - 'docs/OWNER_DASHBOARD_COGNITIVE_COMPRESSION_V1.md'
      - 'vercel.json'
      - '.github/workflows/owner-workspace-radical-simplicity-v2.yml'
  push:
    branches:
      - feature/owner-dashboard-cognitive-compression-v1
    paths:
      - 'src/app/layout.tsx'
      - 'src/app/workspace-anatomy.css'
      - 'src/app/(dashboard)/dashboard/[projectId]/delivery/page.tsx'
      - 'src/components/dashboard/dashboard-shell.tsx'
      - 'src/components/dashboard/dashboard-shell.module.css'
      - 'src/components/dashboard/project-navigation.tsx'
      - 'src/components/dashboard/project-navigation.module.css'
      - 'src/components/projects/project-overview-bootstrap.tsx'
      - 'src/components/projects/project-overview-bootstrap.module.css'
      - 'src/components/projects/invitation-task-workspace.tsx'
      - 'src/components/projects/invitation-task-workspace.module.css'
      - 'tests/unit/owner-workspace-radical-simplicity-v2.test.ts'
      - 'tests/e2e/owner-workspace-radical-simplicity-v2.spec.ts'
      - 'tests/e2e/fixture-app/app/owner-workspace-radical-simplicity-v2/**'
      - 'tests/e2e/fixture-app/app/dashboard/editorial-v3/**'
      - 'playwright.owner-workspace-radical-simplicity-v2.config.ts'
      - 'docs/OWNER_DASHBOARD_COGNITIVE_COMPRESSION_V1.md'
      - 'vercel.json'
      - '.github/workflows/owner-workspace-radical-simplicity-v2.yml'

concurrency:
  group: owner-dashboard-cognitive-compression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose exact Prettier diff
        run: |
          npx prettier --write \
            'src/app/(dashboard)/dashboard/[projectId]/delivery/page.tsx' \
            src/components/projects/project-overview-bootstrap.tsx \
            tests/e2e/owner-workspace-radical-simplicity-v2.spec.ts
          git diff -- \
            'src/app/(dashboard)/dashboard/[projectId]/delivery/page.tsx' \
            src/components/projects/project-overview-bootstrap.tsx \
            tests/e2e/owner-workspace-radical-simplicity-v2.spec.ts
          exit 1
