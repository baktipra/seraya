name: Owner Workspace Radical Simplicity V2 validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/app/design-tokens.css'
      - 'src/app/(dashboard)/dashboard/[projectId]/page.tsx'
      - 'src/components/dashboard/dashboard-icons.tsx'
      - 'src/components/dashboard/dashboard-project-launcher.tsx'
      - 'src/components/dashboard/dashboard-shell.tsx'
      - 'src/components/dashboard/project-navigation.tsx'
      - 'src/components/projects/owner-workspace-visuals.tsx'
      - 'src/components/projects/project-overview-bootstrap.tsx'
      - 'src/components/projects/project-overview-bootstrap.module.css'
      - 'src/components/projects/invitation-task-workspace.tsx'
      - 'src/components/projects/invitation-task-workspace.module.css'
      - 'tests/unit/owner-workspace-radical-simplicity-v2.test.ts'
      - 'tests/e2e/owner-workspace-radical-simplicity-v2.spec.ts'
      - 'tests/e2e/fixture-app/app/owner-workspace-radical-simplicity-v2/**'
      - 'playwright.owner-workspace-radical-simplicity-v2.config.ts'
      - 'docs/OWNER_WORKSPACE_RADICAL_SIMPLICITY_V2.md'
      - 'vercel.json'
      - '.github/workflows/owner-workspace-radical-simplicity-v2.yml'
  push:
    branches:
      - feature/owner-workspace-radical-simplicity-v2
    paths:
      - 'src/app/design-tokens.css'
      - 'src/app/(dashboard)/dashboard/[projectId]/page.tsx'
      - 'src/components/dashboard/dashboard-icons.tsx'
      - 'src/components/dashboard/dashboard-project-launcher.tsx'
      - 'src/components/dashboard/dashboard-shell.tsx'
      - 'src/components/dashboard/project-navigation.tsx'
      - 'src/components/projects/owner-workspace-visuals.tsx'
      - 'src/components/projects/project-overview-bootstrap.tsx'
      - 'src/components/projects/project-overview-bootstrap.module.css'
      - 'src/components/projects/invitation-task-workspace.tsx'
      - 'src/components/projects/invitation-task-workspace.module.css'
      - 'tests/unit/owner-workspace-radical-simplicity-v2.test.ts'
      - 'tests/e2e/owner-workspace-radical-simplicity-v2.spec.ts'
      - 'tests/e2e/fixture-app/app/owner-workspace-radical-simplicity-v2/**'
      - 'playwright.owner-workspace-radical-simplicity-v2.config.ts'
      - 'docs/OWNER_WORKSPACE_RADICAL_SIMPLICITY_V2.md'
      - 'vercel.json'
      - '.github/workflows/owner-workspace-radical-simplicity-v2.yml'

concurrency:
  group: owner-workspace-radical-simplicity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check focused formatting
        run: |
          npx prettier --check \
            src/app/design-tokens.css \
            'src/app/(dashboard)/dashboard/[projectId]/page.tsx' \
            src/components/dashboard/dashboard-icons.tsx \
            src/components/dashboard/dashboard-project-launcher.tsx \
            src/components/dashboard/dashboard-shell.tsx \
            src/components/dashboard/project-navigation.tsx \
            src/components/projects/owner-workspace-visuals.tsx \
            src/components/projects/project-overview-bootstrap.tsx \
            src/components/projects/project-overview-bootstrap.module.css \
            src/components/projects/invitation-task-workspace.tsx \
            src/components/projects/invitation-task-workspace.module.css \
            tests/unit/owner-workspace-radical-simplicity-v2.test.ts \
            tests/e2e/owner-workspace-radical-simplicity-v2.spec.ts \
            tests/e2e/fixture-app/app/owner-workspace-radical-simplicity-v2/page.tsx \
            playwright.owner-workspace-radical-simplicity-v2.config.ts \
            docs/OWNER_WORKSPACE_RADICAL_SIMPLICITY_V2.md \
            vercel.json \
            .github/workflows/owner-workspace-radical-simplicity-v2.yml
      - name: Lint focused source
        run: |
          npx eslint \
            'src/app/(dashboard)/dashboard/[projectId]/page.tsx' \
            src/components/dashboard/dashboard-icons.tsx \
            src/components/dashboard/dashboard-project-launcher.tsx \
            src/components/dashboard/dashboard-shell.tsx \
            src/components/dashboard/project-navigation.tsx \
            src/components/projects/owner-workspace-visuals.tsx \
            src/components/projects/project-overview-bootstrap.tsx \
            src/components/projects/invitation-task-workspace.tsx \
            tests/unit/owner-workspace-radical-simplicity-v2.test.ts \
            tests/e2e/owner-workspace-radical-simplicity-v2.spec.ts \
            tests/e2e/fixture-app/app/owner-workspace-radical-simplicity-v2/page.tsx \
            playwright.owner-workspace-radical-simplicity-v2.config.ts
      - run: npm run typecheck
      - name: Run radical simplicity and Invitation Studio A-G compatibility contracts
        run: |
          npx vitest run \
            tests/unit/owner-workspace-radical-simplicity-v2.test.ts \
            tests/unit/owner-workspace-usability-reset-v1.test.ts \
            tests/unit/invitation-studio-structural-foundation-slice-a.test.tsx \
            tests/unit/invitation-studio-unified-state-slice-b.test.ts \
            tests/unit/invitation-studio-design-mode-slice-c.test.ts \
            tests/unit/invitation-studio-media-mode-slice-d.test.ts \
            tests/unit/invitation-studio-preview-mode-slice-e.test.ts \
            tests/unit/invitation-studio-publish-mode-slice-f.test.ts \
            tests/unit/invitation-studio-responsive-slice-g.test.tsx \
            src/modules/publications/__tests__/published-invitation.schema.test.ts \
            src/modules/publications/__tests__/publication.service.test.ts \
            src/modules/payments/__tests__/payment-publish-policy.test.ts \
            tests/server/dashboard-invitation-editor-route.test.tsx
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop tablet and mobile radical simplicity regression
        run: npx playwright test --config=playwright.owner-workspace-radical-simplicity-v2.config.ts
      - name: Run accepted Slice D media compatibility smoke
        run: npx playwright test --config=playwright.invitation-studio-slice-d.config.ts
      - name: Run accepted Slice G responsive compatibility smoke
        run: npx playwright test --config=playwright.invitation-studio-slice-g.config.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-workspace-radical-simplicity-v2-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
