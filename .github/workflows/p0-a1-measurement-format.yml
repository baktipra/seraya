name: P0-A1 measurement format

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format measurement files
        run: >-
          npx prettier --write
          src/app/api/internal/p0-a1-auth/route.ts
          scripts/measure-authenticated-workspace-transitions.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: p0-a1-measurement-formatted
          path: |
            src/app/api/internal/p0-a1-auth/route.ts
            scripts/measure-authenticated-workspace-transitions.mjs
          retention-days: 1
