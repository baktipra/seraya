name: P0-A1 secret capability

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_AUTOMATION: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_PROTECTION: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
    steps:
      - name: Record capability flags
        shell: bash
        run: |
          mkdir -p p0-a1-capability
          printf '{"service_role":%s,"vercel_automation":%s,"vercel_protection":%s}\n' \
            "$([[ -n "$SERVICE_ROLE" ]] && echo true || echo false)" \
            "$([[ -n "$VERCEL_AUTOMATION" ]] && echo true || echo false)" \
            "$([[ -n "$VERCEL_PROTECTION" ]] && echo true || echo false)" \
            > p0-a1-capability/capability.json
      - uses: actions/upload-artifact@v4
        with:
          name: p0-a1-secret-capability
          path: p0-a1-capability/capability.json
          retention-days: 1
