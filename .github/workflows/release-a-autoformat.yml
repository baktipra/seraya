name: Release A autoformat

on:
  push:
    branches:
      - agent/release-a-flagship-experience

permissions:
  contents: write

jobs:
  format-release-a:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-a-flagship-experience

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Release A files
        run: |
          npx prettier --write \
            src/app/page.tsx \
            src/app/templates/page.tsx \
            src/app/layout.tsx \
            src/app/flagship-release-a.css \
            'src/app/(auth)/layout.tsx' \
            src/components/auth/login-form.tsx \
            src/components/marketing/flagship-marketing.tsx \
            tests/e2e/marketing-home.spec.ts

      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo 'Release A files already use canonical formatting.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/app/page.tsx \
            src/app/templates/page.tsx \
            src/app/layout.tsx \
            src/app/flagship-release-a.css \
            'src/app/(auth)/layout.tsx' \
            src/components/auth/login-form.tsx \
            src/components/marketing/flagship-marketing.tsx \
            tests/e2e/marketing-home.spec.ts
          git commit -m 'Format Release A flagship files'
          git push origin HEAD:agent/release-a-flagship-experience
