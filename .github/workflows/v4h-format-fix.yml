name: V4H temporary format fix

on:
  push:
    branches:
      - feature/v4h-guest-event-utility-v1
    paths:
      - '.github/workflows/v4h-format-fix.yml'
      - 'tests/unit/guest-event-editor-v4h.test.ts'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/v4h-guest-event-utility-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format focused V4H test
        run: npx prettier --write tests/unit/guest-event-editor-v4h.test.ts

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/guest-event-editor-v4h.test.ts
          git commit -m "SERAYA V4H: apply repository formatting"
          git push origin HEAD:feature/v4h-guest-event-utility-v1
