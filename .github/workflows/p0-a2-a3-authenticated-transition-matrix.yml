name: P0-A2-A3 authenticated transition matrix

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      P0_A2_A3_BASE_URL: https://seraya-orcnj26u6-bakti-s-projects.vercel.app/?_vercel_share=45R7uChxUVK7v5fasL4C70ewRw22jqXk
      P0_A2_A3_MEASURED_SHA: 046c89a0b0a4db379c388ed55e5cc367592e7546
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture authenticated transition matrix
        run: node scripts/measure-a2-a3-workspace-transitions.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-a2-a3-authenticated-transition-matrix
          path: p0-a2-a3-matrix
          if-no-files-found: warn
          retention-days: 1
