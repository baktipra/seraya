name: P0-A2-A3 authenticated transition matrix

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      P0_A2_A3_BASE_URL: https://seraya-orcnj26u6-bakti-s-projects.vercel.app/?_vercel_share=45R7uChxUVK7v5fasL4C70ewRw22jqXk
      P0_A2_A3_MEASURED_SHA: 046c89a0b0a4db379c388ed55e5cc367592e7546
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit viewport scaling sources
        run: |
          grep -RInE "zoom|documentElement|visualViewport|meta.*viewport|transform:.*scale|scale\(" src/app src/components src/modules | head -400 || true
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Instrument mobile stacking diagnostic
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/measure-a2-a3-workspace-transitions.mjs';
          const source = fs.readFileSync(path, 'utf8');
          const needle = "  await navigation.getByRole('link', { exact: true, name: target.label }).click();";
          const replacement = `  const link = navigation.getByRole('link', { exact: true, name: target.label });
          if (profileName === 'mobile') {
            const diagnostic = await link.evaluate((element) => {
              const describe = (node) => {
                if (!(node instanceof Element)) return null;
                const style = window.getComputedStyle(node);
                const rect = node.getBoundingClientRect();
                return {
                  tag: node.tagName,
                  id: node.id || null,
                  className: node.getAttribute('class'),
                  attributes: Object.fromEntries(
                    Array.from(node.attributes)
                      .filter((attribute) => attribute.name.startsWith('data-'))
                      .map((attribute) => [attribute.name, attribute.value]),
                  ),
                  rect: {
                    top: rect.top,
                    right: rect.right,
                    bottom: rect.bottom,
                    left: rect.left,
                    width: rect.width,
                    height: rect.height,
                  },
                  style: {
                    position: style.position,
                    zIndex: style.zIndex,
                    isolation: style.isolation,
                    pointerEvents: style.pointerEvents,
                    display: style.display,
                    visibility: style.visibility,
                    opacity: style.opacity,
                    transform: style.transform,
                    zoom: style.zoom,
                    contain: style.contain,
                    overflow: style.overflow,
                  },
                };
              };
              const ancestors = (node) => {
                const result = [];
                let current = node;
                while (current instanceof Element && result.length < 10) {
                  result.push(describe(current));
                  current = current.parentElement;
                }
                return result;
              };
              const rect = element.getBoundingClientRect();
              const centerX = rect.left + rect.width / 2;
              const centerY = rect.top + rect.height / 2;
              const hit = document.elementFromPoint(centerX, centerY);
              const viewportMeta = document.querySelector('meta[name="viewport"]');
              return {
                viewport: {
                  innerWidth: window.innerWidth,
                  innerHeight: window.innerHeight,
                  devicePixelRatio: window.devicePixelRatio,
                  documentClientWidth: document.documentElement.clientWidth,
                  documentClientHeight: document.documentElement.clientHeight,
                  screenWidth: window.screen.width,
                  screenHeight: window.screen.height,
                  visualWidth: window.visualViewport?.width ?? null,
                  visualHeight: window.visualViewport?.height ?? null,
                  visualScale: window.visualViewport?.scale ?? null,
                  meta: viewportMeta?.getAttribute('content') ?? null,
                },
                center: { x: centerX, y: centerY },
                html: describe(document.documentElement),
                body: describe(document.body),
                link: describe(element),
                navigation: describe(element.closest('[data-project-mobile-navigation]')),
                main: describe(document.querySelector('[data-project-workspace-main]')),
                shell: describe(document.querySelector('[data-project-workspace-shell]')),
                hit: describe(hit),
                hitAncestors: ancestors(hit),
                navigationAncestors: ancestors(element.closest('[data-project-mobile-navigation]')),
              };
            });
            console.log('MOBILE_VIEWPORT_DIAGNOSTIC', target.label, JSON.stringify(diagnostic));
          }
          await link.click();`;
          if (!source.includes(needle)) throw new Error('Diagnostic patch target not found.');
          fs.writeFileSync(path, source.replace(needle, replacement));
          NODE
      - name: Capture authenticated transition matrix
        run: node scripts/measure-a2-a3-workspace-transitions.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-a2-a3-authenticated-transition-matrix
          path: p0-a2-a3-matrix
          if-no-files-found: warn
          retention-days: 1
