name: Release A hydration marker stability

on:
  push:
    branches:
      - agent/release-a-flagship-experience

permissions:
  contents: write

jobs:
  stabilize-marker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-a-flagship-experience

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stop React from resetting the readiness marker
        run: >-
          python -c "from pathlib import Path; p=Path('src/components/projects/project-setup-form.tsx');
          s=p.read_text(); s=s.replace('          data-interactive=\"false\"\n', '', 1);
          p.write_text(s)"

      - name: Format repaired file
        run: npx prettier --write src/components/projects/project-setup-form.tsx

      - name: Commit marker stability repair
        run: |
          if git diff --quiet; then
            echo 'Readiness marker is already stable.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/projects/project-setup-form.tsx
          git commit -m 'Keep guided-form readiness marker stable'
          git push origin HEAD:agent/release-a-flagship-experience
