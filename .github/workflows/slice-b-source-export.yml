name: Slice B source export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package source
        run: |
          tar --exclude=.git --exclude=node_modules -czf seraya-slice-b-source.tgz .

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: slice-b-source-export
          path: seraya-slice-b-source.tgz
          retention-days: 1
