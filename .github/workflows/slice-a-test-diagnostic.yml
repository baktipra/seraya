name: Slice A test diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture Vitest output
        run: npm test > slice-a-test.log 2>&1 || true

      - name: Upload Vitest output
        uses: actions/upload-artifact@v4
        with:
          name: slice-a-test-diagnostic
          path: slice-a-test.log
          if-no-files-found: error
          retention-days: 1
