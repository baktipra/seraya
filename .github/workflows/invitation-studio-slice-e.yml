name: Invitation Studio Slice E Preview Mode validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/app/(dashboard)/dashboard/[projectId]/invitation/page.tsx'
      - 'src/components/projects/invitation-studio-preview-mode.tsx'
      - 'src/components/projects/invitation-studio-preview-mode.module.css'
      - 'src/components/projects/invitation-studio-preview.types.ts'
      - 'tests/unit/invitation-studio-preview-mode-slice-e.test.ts'
      - 'tests/e2e/invitation-studio-preview-mode-slice-e.spec.ts'
      - 'tests/e2e/fixture-app/app/invitation-studio-slice-e/**'
      - 'playwright.invitation-studio-slice-e.config.ts'
      - '.github/workflows/invitation-studio-slice-e.yml'
  push:
    branches:
      - feature/invitation-studio-slice-e-preview-version-truth-authority
    paths:
      - 'src/app/(dashboard)/dashboard/[projectId]/invitation/page.tsx'
      - 'src/components/projects/invitation-studio-preview-mode.tsx'
      - 'src/components/projects/invitation-studio-preview-mode.module.css'
      - 'src/components/projects/invitation-studio-preview.types.ts'
      - 'tests/unit/invitation-studio-preview-mode-slice-e.test.ts'
      - 'tests/e2e/invitation-studio-preview-mode-slice-e.spec.ts'
      - 'tests/e2e/fixture-app/app/invitation-studio-slice-e/**'
      - 'playwright.invitation-studio-slice-e.config.ts'
      - '.github/workflows/invitation-studio-slice-e.yml'

concurrency:
  group: invitation-studio-slice-e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check focused formatting
        run: |
          npx prettier --check \
            'src/app/(dashboard)/dashboard/[projectId]/invitation/page.tsx' \
            src/components/projects/invitation-studio-preview-mode.tsx \
            src/components/projects/invitation-studio-preview-mode.module.css \
            src/components/projects/invitation-studio-preview.types.ts \
            tests/unit/invitation-studio-preview-mode-slice-e.test.ts \
            tests/e2e/invitation-studio-preview-mode-slice-e.spec.ts \
            tests/e2e/fixture-app/app/invitation-studio-slice-e/page.tsx \
            tests/e2e/fixture-app/app/invitation-studio-slice-e/fixture-client.tsx \
            playwright.invitation-studio-slice-e.config.ts \
            .github/workflows/invitation-studio-slice-e.yml
      - name: Lint focused source
        run: |
          npx eslint \
            'src/app/(dashboard)/dashboard/[projectId]/invitation/page.tsx' \
            src/components/projects/invitation-studio-preview-mode.tsx \
            src/components/projects/invitation-studio-preview.types.ts \
            tests/unit/invitation-studio-preview-mode-slice-e.test.ts \
            tests/e2e/invitation-studio-preview-mode-slice-e.spec.ts \
            tests/e2e/fixture-app/app/invitation-studio-slice-e/page.tsx \
            tests/e2e/fixture-app/app/invitation-studio-slice-e/fixture-client.tsx \
            playwright.invitation-studio-slice-e.config.ts
      - run: npm run typecheck
      - name: Run Slice A through E and publication compatibility contracts
        run: |
          npx vitest run \
            tests/unit/invitation-studio-structural-foundation-slice-a.test.tsx \
            tests/unit/invitation-studio-unified-state-slice-b.test.ts \
            tests/unit/invitation-studio-design-mode-slice-c.test.ts \
            tests/unit/invitation-studio-media-mode-slice-d.test.ts \
            tests/unit/invitation-studio-preview-mode-slice-e.test.ts \
            src/modules/publications/__tests__/published-invitation.schema.test.ts \
            src/modules/publications/__tests__/publication.service.test.ts
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile Preview Mode smoke
        run: npx playwright test --config=playwright.invitation-studio-slice-e.config.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-studio-slice-e-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
