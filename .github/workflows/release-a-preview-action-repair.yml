name: Release A preview action isolation

on:
  push:
    branches:
      - agent/release-a-flagship-experience

permissions:
  contents: write

jobs:
  isolate-preview-action:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-a-flagship-experience

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Isolate showroom from owner server action
        run: |
          python - <<'PY'
          from pathlib import Path

          form_path = Path('src/components/projects/project-setup-form.tsx')
          form = form_path.read_text()
          form = form.replace(
              "import { initialCreateProjectActionState } from '@/modules/projects/create-project.action-state';",
              "import {\n  initialCreateProjectActionState,\n  type CreateProjectActionState,\n} from '@/modules/projects/create-project.action-state';",
              1,
          )
          form = form.replace(
              'export function ProjectSetupForm() {\n  const [state, formAction, isPending] = useActionState(\n    createProjectAction,',
              "async function previewCreateProjectAction(\n  _previousState: CreateProjectActionState,\n  _formData: FormData,\n): Promise<CreateProjectActionState> {\n  return {\n    message: 'Showroom tidak membuat project atau menyimpan data.',\n    status: 'error',\n  };\n}\n\nexport function ProjectSetupForm({ previewMode = false }: { previewMode?: boolean } = {}) {\n  const [state, formAction, isPending] = useActionState(\n    previewMode ? previewCreateProjectAction : createProjectAction,",
              1,
          )
          form_path.write_text(form)

          preview_path = Path('src/app/release-a-preview/page.tsx')
          preview = preview_path.read_text().replace('<ProjectSetupForm />', '<ProjectSetupForm previewMode />', 1)
          preview_path.write_text(preview)
          PY

      - name: Format repaired files
        run: |
          npx prettier --write \
            src/components/projects/project-setup-form.tsx \
            src/app/release-a-preview/page.tsx

      - name: Commit preview action isolation
        run: |
          if git diff --quiet; then
            echo 'Preview action already isolated.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/components/projects/project-setup-form.tsx \
            src/app/release-a-preview/page.tsx
          git commit -m 'Isolate showroom from owner project action'
          git push origin HEAD:agent/release-a-flagship-experience
