name: Release A showroom island wiring

on:
  push:
    branches:
      - agent/release-a-flagship-experience

permissions:
  contents: write

jobs:
  wire-showroom-island:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-a-flagship-experience

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wire client-only setup showroom
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/release-a-preview/page.tsx')
          content = path.read_text()
          content = content.replace(
              "import { ProjectSetupForm } from '@/components/projects/project-setup-form';",
              "import { ProjectSetupShowroom } from '@/components/projects/project-setup-showroom';",
              1,
          )
          content = content.replace('<ProjectSetupForm previewMode />', '<ProjectSetupShowroom />', 1)
          path.write_text(content)
          PY

      - name: Format wired files
        run: |
          npx prettier --write \
            src/app/release-a-preview/page.tsx \
            src/components/projects/project-setup-showroom.tsx

      - name: Commit showroom island wiring
        run: |
          if git diff --quiet; then
            echo 'Showroom island already wired.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/app/release-a-preview/page.tsx \
            src/components/projects/project-setup-showroom.tsx
          git commit -m 'Wire client-only guided setup showroom'
          git push origin HEAD:agent/release-a-flagship-experience
