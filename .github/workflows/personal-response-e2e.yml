name: Personal response browser regression

on:
  pull_request:
    paths:
      - '.github/workflows/personal-response-e2e.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'playwright.personal-response.config.ts'
      - 'tsconfig.j1r-e.json'
      - 'src/app/accessibility-release.css'
      - 'src/app/personal-response-release.css'
      - 'src/components/personal-invitation/**'
      - 'src/modules/invitation-templates/**'
      - 'tests/e2e/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/personal-response-e2e.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'playwright.personal-response.config.ts'
      - 'tsconfig.j1r-e.json'
      - 'src/app/accessibility-release.css'
      - 'src/app/personal-response-release.css'
      - 'src/components/personal-invitation/**'
      - 'src/modules/invitation-templates/**'
      - 'tests/e2e/**'

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check J1R-E formatting
        run: |
          files="$(npx prettier --list-different \
            .github/workflows/personal-response-e2e.yml \
            package.json \
            playwright.config.ts \
            playwright.personal-response.config.ts \
            tsconfig.j1r-e.json \
            src/modules/invitation-templates/invitation-template-renderer.tsx \
            tests/e2e || true)"
          if [ -n "$files" ]; then
            while IFS= read -r file; do
              echo "::error file=$file::Prettier formatting differs"
            done <<< "$files"
            exit 1
          fi

      - name: Lint J1R-E files
        run: |
          npx eslint \
            playwright.config.ts \
            playwright.personal-response.config.ts \
            src/modules/invitation-templates/invitation-template-renderer.tsx \
            tests/e2e/personal-response.spec.ts \
            tests/e2e/fixture-app

      - name: Typecheck J1R-E graph
        run: npx tsc --noEmit --project tsconfig.j1r-e.json

      - name: Run personal response contract tests
        run: |
          npm test -- \
            src/modules/invitation-templates/__tests__/personal-response-contract.test.tsx \
            src/modules/invitation-templates/__tests__/personal-response-visual-state-contract.test.ts

      - name: Build production application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run personal response browser regression
        run: npm run e2e:personal-response

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-response-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
