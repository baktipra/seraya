name: Personal response browser regression

on:
  pull_request:
    paths:
      - '.github/workflows/personal-response-e2e.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'playwright.personal-response.config.ts'
      - 'tsconfig.j1r-e.json'
      - 'src/app/accessibility-release.css'
      - 'src/app/personal-response-release.css'
      - 'src/components/personal-invitation/**'
      - 'src/modules/invitation-templates/**'
      - 'tests/e2e/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/personal-response-e2e.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'playwright.personal-response.config.ts'
      - 'tsconfig.j1r-e.json'
      - 'src/app/accessibility-release.css'
      - 'src/app/personal-response-release.css'
      - 'src/components/personal-invitation/**'
      - 'src/modules/invitation-templates/**'
      - 'tests/e2e/**'

permissions:
  contents: write

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize inherited fixture formatting
        run: |
          npx prettier --write \
            tests/e2e/fixture-app/app/owner-workspace-usability-reset/page.tsx \
            tests/e2e/fixture-app/app/owner-workspace-usability-reset/fixture-client.tsx

      - name: Commit inherited fixture formatting
        run: |
          if git diff --quiet -- \
            tests/e2e/fixture-app/app/owner-workspace-usability-reset/page.tsx \
            tests/e2e/fixture-app/app/owner-workspace-usability-reset/fixture-client.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/e2e/fixture-app/app/owner-workspace-usability-reset/page.tsx \
            tests/e2e/fixture-app/app/owner-workspace-usability-reset/fixture-client.tsx
          git commit -m "chore: normalize inherited e2e fixture formatting"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Check J1R-E formatting
        run: |
          npx prettier --check \
            .github/workflows/personal-response-e2e.yml \
            package.json \
            playwright.config.ts \
            playwright.personal-response.config.ts \
            tsconfig.j1r-e.json \
            src/modules/invitation-templates/invitation-template-renderer.tsx \
            tests/e2e

      - name: Lint J1R-E files
        run: |
          npx eslint \
            playwright.config.ts \
            playwright.personal-response.config.ts \
            src/modules/invitation-templates/invitation-template-renderer.tsx \
            tests/e2e/personal-response.spec.ts \
            tests/e2e/fixture-app

      - name: Typecheck J1R-E graph
        run: npx tsc --noEmit --project tsconfig.j1r-e.json

      - name: Run personal response contract tests
        run: |
          npm test -- \
            src/modules/invitation-templates/__tests__/personal-response-contract.test.tsx \
            src/modules/invitation-templates/__tests__/personal-response-visual-state-contract.test.ts

      - name: Build production application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run personal response browser regression
        run: npm run e2e:personal-response

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-response-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
