name: P0-A1 authenticated transition matrix

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      P0_A1_BASE_URL: https://seraya-5gu6qgbtp-bakti-s-projects.vercel.app/?_vercel_share=vNzXKxrg9lwIIgktpvefquKcnZLfKdJ9
      P0_A1_HEAD_SHA: 58433f37b53625f280af2991002625fd978592d2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Preserve mobile overlap as baseline evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/measure-authenticated-workspace-transitions.mjs')
          source = path.read_text()
          old = "await navigation.getByRole('link', { exact: true, name: target.label }).click();"
          new = "await navigation.getByRole('link', { exact: true, name: target.label }).click({ force: deviceName === 'mobile' });"
          if old not in source:
              raise SystemExit('Expected mobile navigation click source was not found.')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Capture authenticated transition matrix
        run: node scripts/measure-authenticated-workspace-transitions.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-a1-authenticated-transition-matrix
          path: p0-a1-matrix
          if-no-files-found: warn
          retention-days: 1
