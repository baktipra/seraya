name: Format Invitation Studio Slice D validation files

on:
  push:
    branches:
      - feature/invitation-studio-slice-d-media-mode-asset-authority
    paths:
      - '.github/workflows/invitation-studio-slice-d-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/invitation-studio-slice-d-media-mode-asset-authority
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Slice D files
        run: |
          npx prettier --write \
            src/components/projects/invitation-studio-media-mode.tsx \
            src/components/projects/invitation-studio-media-mode.module.css \
            src/app/api/projects/[projectId]/gallery/reorder/route.ts \
            tests/unit/invitation-studio-media-mode-slice-d.test.ts \
            tests/e2e/invitation-studio-media-mode-slice-d.spec.ts \
            tests/e2e/fixture-app/app/invitation-studio-slice-d/page.tsx \
            tests/e2e/fixture-app/app/invitation-studio-slice-d/fixture-client.tsx \
            playwright.invitation-studio-slice-d.config.ts \
            docs/INVITATION_STUDIO_SLICE_D_MEDIA_MODE.md
      - name: Commit formatting
        run: |
          git config user.name "seraya-release-bot"
          git config user.email "88146860+baktipra@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "SERAYA Slice D: format Media Mode validation files"
            git push origin HEAD:feature/invitation-studio-slice-d-media-mode-asset-authority
          fi
