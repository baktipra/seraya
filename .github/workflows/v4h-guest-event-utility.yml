name: V4H guest event utility validation

on:
  pull_request:
    paths:
      - '.github/workflows/v4h-guest-event-utility.yml'
      - 'docs/V4H_GUEST_EVENT_UTILITY.md'
      - 'src/components/projects/event-utility-editor-fields.tsx'
      - 'src/components/projects/invitation-editor-fields.tsx'
      - 'src/modules/invitation-templates/guest-event-utility-core.ts'
      - 'src/modules/invitation-templates/guest-event-utility.tsx'
      - 'src/modules/invitation-templates/invitation-template-parity-boundary.tsx'
      - 'src/modules/invitation-templates/invitation-view-model.ts'
      - 'src/modules/invitations/invitation-draft.defaults.ts'
      - 'src/modules/invitations/invitation-draft.schema.ts'
      - 'src/modules/invitations/invitation-editor-local-state.ts'
      - 'src/modules/invitations/invitation-editor.schema.ts'
      - 'src/modules/invitations/invitation-editor.service.ts'
      - 'tests/unit/guest-event-utility-v4h.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check V4H formatting
        run: |
          npx prettier --check \
            .github/workflows/v4h-guest-event-utility.yml \
            docs/V4H_GUEST_EVENT_UTILITY.md \
            src/components/projects/event-utility-editor-fields.tsx \
            src/components/projects/invitation-editor-fields.tsx \
            src/modules/invitation-templates/guest-event-utility-core.ts \
            src/modules/invitation-templates/guest-event-utility.tsx \
            src/modules/invitation-templates/invitation-template-parity-boundary.tsx \
            src/modules/invitation-templates/invitation-view-model.ts \
            src/modules/invitations/invitation-draft.defaults.ts \
            src/modules/invitations/invitation-draft.schema.ts \
            src/modules/invitations/invitation-editor-local-state.ts \
            src/modules/invitations/invitation-editor.schema.ts \
            src/modules/invitations/invitation-editor.service.ts \
            tests/unit/guest-event-utility-v4h.test.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        shell: bash
        run: |
          set +e
          npm run test -- --reporter=json --outputFile=/tmp/v4h-vitest.json
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('/tmp/v4h-vitest.json','utf8'));const f=(r.testResults||[]).flatMap(x=>(x.assertionResults||[]).filter(t=>t.status==='failed').map(t=>({file:x.name,title:[...(t.ancestorTitles||[]),t.title].join(' > '),messages:t.failureMessages||[]})));console.error('V4H validation found '+f.length+' failed unit test(s).');for(const x of f){console.error('\\nFAIL '+x.file+'\\n  '+x.title);for(const m of x.messages)console.error(m)}"
            exit "$status"
          fi

      - name: Production build
        run: npm run build
