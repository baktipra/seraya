name: V4J final Slice A core implementation

on:
  push:
    branches:
      - feature/v4j-invitation-atmosphere-couple-identity-v1
    paths:
      - '.github/workflows/v4j-slice-a-core-v3.yml'

permissions:
  contents: write

jobs:
  implement-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/v4j-invitation-atmosphere-couple-identity-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reuse corrected core implementation
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/v4j-slice-a-core-v2.yml').read_text().splitlines()
          step_index = next(
              index
              for index, line in enumerate(workflow)
              if line.strip() == '- name: Apply corrected Slice A core'
          )
          run_index = next(
              index
              for index in range(step_index + 1, len(workflow))
              if workflow[index].strip() == 'run: |'
          )
          end_index = next(
              index
              for index in range(run_index + 1, len(workflow))
              if workflow[index].strip() == '- name: Format corrected core'
          )
          body = workflow[run_index + 1 : end_index]
          indentation = min(
              len(line) - len(line.lstrip()) for line in body if line.strip()
          )
          Path('/tmp/v4j-apply-core.sh').write_text(
              '\n'.join(line[indentation:] if line.strip() else '' for line in body) + '\n'
          )
          PY
          bash /tmp/v4j-apply-core.sh

      - name: Preserve typed publication fixture compatibility
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/modules/publications/__tests__/publication.service.test.ts')
          text = path.read_text()
          old = """        couple: {
                    personOne: { displayName: 'Raka', fullName: null, parentLine: null },
                    personTwo: { displayName: 'Nadia', fullName: null, parentLine: null },
                  },
                  eventSchedule: {
          """
          new = """        couple: {
                    personOne: { displayName: 'Raka', fullName: null, parentLine: null },
                    personTwo: { displayName: 'Nadia', fullName: null, parentLine: null },
                  },
                  coupleIdentity: {
                    monogram: { enabled: false, style: 'initials', text: null },
                    shortName: null,
                    socialLinks: { instagram: null, tiktok: null, website: null },
                    weddingHashtag: null,
                  },
                  eventSchedule: {
          """
          if old not in text:
              raise SystemExit('Publication fixture couple anchor missing.')
          text = text.replace(old, new, 1)
          old = """        meta: { locale: 'id-ID', timezone: 'Asia/Jakarta' },
                  rsvp: { enabled: true, heading: null, lead: null },
          """
          new = """        meta: { locale: 'id-ID', timezone: 'Asia/Jakarta' },
                  opening: { message: null, quote: null, treatment: 'soft' },
                  rsvp: { enabled: true, heading: null, lead: null },
          """
          if old not in text:
              raise SystemExit('Publication fixture opening anchor missing.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format final core
        run: |
          npx prettier --write \
            src/modules/invitations/invitation-draft.schema.ts \
            src/modules/invitations/invitation-draft.defaults.ts \
            src/modules/invitations/invitation-editor-local-state.ts \
            src/modules/invitations/invitation-editor.schema.ts \
            src/modules/invitations/invitation-editor.service.ts \
            src/modules/invitation-templates/invitation-view-model.ts \
            src/modules/invitation-templates/invitation-atmosphere-identity.tsx \
            src/modules/invitation-templates/invitation-atmosphere-identity.module.css \
            src/modules/publications/__tests__/publication.service.test.ts \
            tests/unit/invitation-atmosphere-identity-v4j.test.tsx

      - name: Validate final core
        run: |
          npx eslint \
            src/modules/invitations/invitation-draft.schema.ts \
            src/modules/invitations/invitation-draft.defaults.ts \
            src/modules/invitations/invitation-editor-local-state.ts \
            src/modules/invitations/invitation-editor.schema.ts \
            src/modules/invitations/invitation-editor.service.ts \
            src/modules/invitation-templates/invitation-view-model.ts \
            src/modules/invitation-templates/invitation-atmosphere-identity.tsx \
            src/modules/publications/__tests__/publication.service.test.ts \
            tests/unit/invitation-atmosphere-identity-v4j.test.tsx
          npm run typecheck
          npx vitest run tests/unit/invitation-atmosphere-identity-v4j.test.tsx
          npm run build

      - name: Commit final core
        run: |
          rm .github/workflows/v4j-slice-a-apply.yml
          rm .github/workflows/v4j-slice-a-core-apply.yml
          rm .github/workflows/v4j-slice-a-core-v2.yml
          rm .github/workflows/v4j-slice-a-core-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/v4j-slice-a-apply.yml .github/workflows/v4j-slice-a-core-apply.yml .github/workflows/v4j-slice-a-core-v2.yml .github/workflows/v4j-slice-a-core-v3.yml
          git commit -m "SERAYA V4J: add opening and couple identity core contract"
          git push origin HEAD:feature/v4j-invitation-atmosphere-couple-identity-v1
