name: Format Invitation Studio Slice C fixtures

on:
  push:
    branches:
      - feature/invitation-studio-slice-c-design-mode
    paths:
      - '.github/workflows/invitation-studio-slice-c-bootstrap.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/invitation-studio-slice-c-design-mode
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Slice C browser files
        run: |
          npx prettier --write \
            tests/e2e/invitation-studio-design-mode-slice-c.spec.ts \
            tests/e2e/fixture-app/app/invitation-studio-slice-c/fixture-client.tsx
      - name: Commit formatting
        run: |
          git config user.name "seraya-release-bot"
          git config user.email "88146860+baktipra@users.noreply.github.com"
          git add tests/e2e/invitation-studio-design-mode-slice-c.spec.ts \
            tests/e2e/fixture-app/app/invitation-studio-slice-c/fixture-client.tsx
          git diff --cached --stat
          git commit -m "SERAYA Slice C: format Design Mode fixtures"
          git push origin HEAD:feature/invitation-studio-slice-c-design-mode
