name: V4J invitation atmosphere and identity validation

on:
  pull_request:
    paths:
      - 'src/app/**/audio/**'
      - 'src/app/[slug]/**'
      - 'src/app/(dashboard)/dashboard/[projectId]/preview/**'
      - 'src/components/invitation-audio-playback-control.*'
      - 'src/components/projects/invitation-audio-manager.tsx'
      - 'src/components/projects/invitation-editor*.tsx'
      - 'src/modules/invitations/**'
      - 'src/modules/invitation-templates/**'
      - 'src/modules/media/invitation-audio*'
      - 'src/modules/publications/**'
      - 'supabase/migrations/20260805002300_m0023_add_invitation_audio_media_foundation.sql'
      - 'tests/unit/invitation-*-v4j.test.*'
      - 'tests/integration/supabase-foundation.test.ts'
      - '.github/workflows/v4j-invitation-atmosphere-identity.yml'
  push:
    branches:
      - feature/v4j-invitation-atmosphere-couple-identity-v1
    paths:
      - 'src/app/**/audio/**'
      - 'src/app/[slug]/**'
      - 'src/app/(dashboard)/dashboard/[projectId]/preview/**'
      - 'src/components/invitation-audio-playback-control.*'
      - 'src/components/projects/invitation-audio-manager.tsx'
      - 'src/components/projects/invitation-editor*.tsx'
      - 'src/modules/invitations/**'
      - 'src/modules/invitation-templates/**'
      - 'src/modules/media/invitation-audio*'
      - 'src/modules/publications/**'
      - 'supabase/migrations/20260805002300_m0023_add_invitation_audio_media_foundation.sql'
      - 'tests/unit/invitation-*-v4j.test.*'
      - 'tests/integration/supabase-foundation.test.ts'
      - '.github/workflows/v4j-invitation-atmosphere-identity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check V4J formatting
        run: |
          npx prettier --check \
            src/app/api/invitations/[slug]/audio/playback/route.ts \
            src/app/api/projects/[projectId]/audio \
            'src/app/(dashboard)/dashboard/[projectId]/preview/page.tsx' \
            src/app/[slug] \
            src/components/invitation-audio-playback-control.* \
            src/components/projects/invitation-audio-manager.tsx \
            src/components/projects/invitation-editor*.tsx \
            src/modules/invitations \
            src/modules/invitation-templates \
            src/modules/media/invitation-audio* \
            src/modules/publications/publication.service.ts \
            src/modules/publications/__tests__/publication.service.test.ts \
            tests/unit/invitation-*-v4j.test.* \
            tests/integration/supabase-foundation.test.ts
      - name: Lint V4J source
        run: |
          npx eslint \
            src/app/api/invitations/[slug]/audio/playback/route.ts \
            src/app/api/projects/[projectId]/audio \
            'src/app/(dashboard)/dashboard/[projectId]/preview/page.tsx' \
            src/app/[slug] \
            src/components/invitation-audio-playback-control.tsx \
            src/components/projects/invitation-audio-manager.tsx \
            src/components/projects/invitation-editor*.tsx \
            src/modules/invitations \
            src/modules/invitation-templates \
            src/modules/media/invitation-audio* \
            src/modules/publications/publication.service.ts \
            src/modules/publications/__tests__/publication.service.test.ts \
            tests/unit/invitation-*-v4j.test.* \
            tests/integration/supabase-foundation.test.ts
      - run: npm run typecheck
      - name: Focused V4J contracts
        run: |
          npx vitest run \
            tests/unit/invitation-atmosphere-identity-v4j.test.tsx \
            tests/unit/invitation-audio-media-v4j.test.ts \
            tests/unit/invitation-audio-playback-v4j.test.ts \
            src/modules/publications/__tests__/publication.service.test.ts
      - name: Full migration-chain contracts
        run: npx vitest run tests/integration/supabase-foundation.test.ts
      - run: npm run build
