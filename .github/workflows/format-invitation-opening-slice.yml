name: Format invitation opening slice

on:
  push:
    branches:
      - agent/release-a-flagship-experience

permissions:
  contents: write

jobs:
  format-opening-slice:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-a-flagship-experience

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format opening slice
        run: |
          npx prettier --write \
            .github/workflows/invitation-experience-e2e.yml \
            src/app/invitation-opening-maturation-release.css \
            src/app/layout.tsx \
            src/modules/invitation-templates/laras/laras-monogram.ts \
            src/modules/invitation-templates/laras/laras-template.tsx \
            src/modules/invitation-templates/__tests__/invitation-opening-identity-contract.test.ts \
            tests/e2e/invitation-experience.spec.ts

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo 'Opening slice files are already formatted.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/invitation-experience-e2e.yml \
            src/app/invitation-opening-maturation-release.css \
            src/app/layout.tsx \
            src/modules/invitation-templates/laras/laras-monogram.ts \
            src/modules/invitation-templates/laras/laras-template.tsx \
            src/modules/invitation-templates/__tests__/invitation-opening-identity-contract.test.ts \
            tests/e2e/invitation-experience.spec.ts
          git commit -m 'Format flagship opening maturation slice'
          git push origin HEAD:agent/release-a-flagship-experience
