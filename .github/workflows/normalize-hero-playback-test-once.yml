name: Normalize hero playback test once

on:
  pull_request:
    paths:
      - '.github/workflows/normalize-hero-playback-test-once.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'agent/homepage-hero-surface-motion-v3-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/homepage-hero-surface-motion-v3-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/homepage-product-theater.spec.ts
      - name: Commit normalized test
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/homepage-product-theater.spec.ts
          git commit -m "SERAYA — Normalize hero playback contract"
          git push origin HEAD:agent/homepage-hero-surface-motion-v3-1
