name: Apply V4H editor integration

on:
  push:
    branches:
      - feature/v4h-guest-event-utility-v1

permissions:
  contents: write

concurrency:
  group: apply-v4h-editor-integration
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip v4h patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic source patches
        run: node scripts/apply-v4h-editor-patches.mjs

      - name: Format V4H sources
        run: |
          npx prettier --write \
            src/components/projects/event-utility-editor-fields.tsx \
            src/components/projects/invitation-editor-fields.tsx \
            src/modules/invitations/invitation-editor.schema.ts \
            src/modules/invitations/invitation-editor.service.ts \
            src/modules/invitations/invitation-editor-local-state.ts \
            src/modules/invitations/invitation-draft.defaults.ts \
            src/modules/invitations/invitation-draft.schema.ts \
            src/modules/invitation-templates/guest-event-utility-core.ts \
            src/modules/invitation-templates/guest-event-utility.tsx \
            src/modules/invitation-templates/invitation-template-parity-boundary.tsx \
            src/modules/invitation-templates/invitation-view-model.ts

      - name: Commit editor integration
        run: |
          git config user.name 'seraya-v4h-bot'
          git config user.email 'seraya-v4h-bot@users.noreply.github.com'
          git add src scripts/apply-v4h-editor-patches.mjs
          if git diff --cached --quiet; then
            echo 'V4H editor integration is already applied.'
            exit 0
          fi
          git commit -m 'SERAYA V4H: integrate guest event utility editor [skip v4h patch]'
          git push origin HEAD:feature/v4h-guest-event-utility-v1
