name: Normalize editorial hero once

on:
  push:
    branches:
      - agent/homepage-editorial-premium-hero-v2

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[hero-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/homepage-editorial-premium-hero-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize focused files
        run: |
          npx prettier --write \
            src/app/page.tsx \
            src/components/marketing/editorial-hero.tsx \
            src/components/marketing/editorial-hero.module.css \
            tests/e2e/homepage-product-theater.spec.ts \
            public/marketing/hero/*.svg
      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/page.tsx \
            src/components/marketing/editorial-hero.tsx \
            src/components/marketing/editorial-hero.module.css \
            tests/e2e/homepage-product-theater.spec.ts \
            public/marketing/hero/*.svg
          git commit -m "SERAYA — Normalize editorial hero files [hero-normalized]"
          git push origin HEAD:agent/homepage-editorial-premium-hero-v2
