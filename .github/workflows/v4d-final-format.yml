name: V4D Final Format

on:
  pull_request:
    branches:
      - agent/canonical-theme-package-architecture-v4c
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out V4D branch
        uses: actions/checkout@v4
        with:
          ref: agent/runtime-palette-selection-persistence-v4d
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format browser contract
        run: npx prettier --write tests/e2e/homepage-theme-grid.spec.ts

      - name: Commit formatted contract
        run: |
          rm .github/workflows/v4d-final-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: normalize V4D browser contract"
          git push origin HEAD:agent/runtime-palette-selection-persistence-v4d
