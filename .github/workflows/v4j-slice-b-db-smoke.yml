name: V4J Slice B migration smoke

on:
  push:
    branches:
      - feature/v4j-invitation-atmosphere-couple-identity-v1
    paths:
      - '.github/workflows/v4j-slice-b-db-smoke.yml'

permissions:
  contents: write

jobs:
  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/v4j-invitation-atmosphere-couple-identity-v1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repair PGlite citext compatibility
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('tests/integration/supabase-foundation.test.ts')
          content = path.read_text()
          old = ".replaceAll('extensions.citext', 'text');"
          new = ".replaceAll('extensions.citext', 'text')\n      .replace(/\\bcitext\\b/g, 'text');"
          if old not in content:
              raise SystemExit('PGlite citext shim anchor missing.')
          path.write_text(content.replace(old, new, 1))
          PY
          npx prettier --write tests/integration/supabase-foundation.test.ts
      - name: Apply full migration chain in PGlite
        run: npx vitest run tests/integration/supabase-foundation.test.ts
      - name: Commit validated harness repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/supabase-foundation.test.ts
          git commit -m "SERAYA: repair PGlite citext migration harness"
          git push origin HEAD:feature/v4j-invitation-atmosphere-couple-identity-v1
