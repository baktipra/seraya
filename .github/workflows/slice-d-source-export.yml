name: Slice D source export

on:
  push:
    branches:
      - agent/follow-up-slice-d-workspace

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Package source
        run: zip -qr seraya-slice-d-source.zip . -x '.git/*' 'node_modules/*' 'seraya-slice-d-source.zip'

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: slice-d-source-export
          path: seraya-slice-d-source.zip
          retention-days: 1
