name: P0 B1 B2 format once

on:
  push:
    branches:
      - agent/p0-b1-b2-invitation-layout-recovery

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/p0-b1-b2-invitation-layout-recovery

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format scoped files
        run: |
          npx prettier --write \
            src/app/invitation-layout-recovery.css \
            src/modules/invitation-templates/__tests__/shared-invitation-layout-journey-recovery-contract.test.ts \
            src/modules/invitation-templates/roselle/roselle-template.tsx \
            tests/e2e/invitation-experience.spec.ts

      - name: Commit formatted output
        run: |
          if git diff --quiet; then
            echo "No formatting changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/invitation-layout-recovery.css \
            src/modules/invitation-templates/__tests__/shared-invitation-layout-journey-recovery-contract.test.ts \
            src/modules/invitation-templates/roselle/roselle-template.tsx \
            tests/e2e/invitation-experience.spec.ts
          git commit -m "P0-B1/B2: format invitation recovery scope"
          git push origin HEAD:agent/p0-b1-b2-invitation-layout-recovery
