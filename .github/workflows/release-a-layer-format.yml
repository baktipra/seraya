name: Release A layer format

on:
  push:
    branches:
      - agent/release-a-flagship-experience

permissions:
  contents: write

jobs:
  repair-and-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-a-flagship-experience

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair collection fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/projects/project-setup-form.tsx')
          content = path.read_text()
          content = content.replace(
              "collectionOptions.find((item) => item.key === templateKey) ?? collectionOptions[0];",
              "collectionOptions.find((item) => item.key === templateKey) ?? collectionOptions[0]!;",
          )
          path.write_text(content)
          PY

      - name: Format Release A layer
        run: |
          npx prettier --write \
            src/components/projects/project-setup-form.tsx \
            src/components/dashboard/project-navigation.tsx \
            src/components/dashboard/dashboard-shell.tsx \
            src/components/dashboard/dashboard-project-launcher.tsx \
            src/components/dashboard/dashboard-empty-state.tsx \
            src/modules/projects/create-project.schema.ts \
            src/modules/projects/create-project.service.ts

      - name: Commit canonical layer
        run: |
          if git diff --quiet; then
            echo 'Release A layer already canonical.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/components/projects/project-setup-form.tsx \
            src/components/dashboard/project-navigation.tsx \
            src/components/dashboard/dashboard-shell.tsx \
            src/components/dashboard/dashboard-project-launcher.tsx \
            src/components/dashboard/dashboard-empty-state.tsx \
            src/modules/projects/create-project.schema.ts \
            src/modules/projects/create-project.service.ts
          git commit -m 'Format guided creation and workspace layer'
          git push origin HEAD:agent/release-a-flagship-experience
