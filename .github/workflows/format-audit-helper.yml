name: Slice A format finalizer

on:
  push:
    branches:
      - agent/follow-up-slice-a-domain-persistence

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/follow-up-slice-a-domain-persistence
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repository formatting
        run: npx prettier --write .

      - name: Remove temporary finalizer
        run: rm .github/workflows/format-audit-helper.yml

      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize inherited formatting for Slice A validation"
          git push origin HEAD:agent/follow-up-slice-a-domain-persistence
