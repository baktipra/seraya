name: V4C Canonical Theme Package Bootstrap

on:
  push:
    branches:
      - agent/canonical-theme-package-architecture-v4c

permissions:
  contents: write

jobs:
  transform-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/canonical-theme-package-architecture-v4c
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply V4C architecture
        run: python3 scripts/apply-v4c.py

      - name: Install dependencies
        run: npm ci

      - name: Format V4C source
        run: |
          npx prettier --write \
            src/modules/invitation-templates/core \
            src/modules/invitation-templates/roselle/roselle.package.ts \
            src/modules/invitation-templates/aruna/aruna.package.ts \
            src/modules/invitation-templates/laras/laras.package.ts \
            src/modules/invitation-templates/roselle/roselle-template.tsx \
            src/modules/invitation-templates/aruna/aruna-template.tsx \
            src/modules/invitation-templates/laras/laras-template.tsx \
            src/modules/invitation-templates/invitation-template.keys.ts \
            src/modules/invitation-templates/invitation-template.types.ts \
            src/modules/invitation-templates/invitation-template-parity.ts \
            src/modules/invitation-templates/invitation-template.registry.ts \
            src/modules/invitation-templates/invitation-template-renderer.tsx \
            src/components/marketing/theme-catalog.ts \
            src/components/marketing/homepage-theme-grid.module.css \
            src/components/marketing/flagship-marketing.tsx \
            src/components/projects/project-setup-form.tsx \
            tests/unit/invitation-theme-package-registry.test.ts

      - name: Focused lint
        run: |
          npx eslint \
            src/modules/invitation-templates/core \
            src/modules/invitation-templates/roselle/roselle.package.ts \
            src/modules/invitation-templates/aruna/aruna.package.ts \
            src/modules/invitation-templates/laras/laras.package.ts \
            src/modules/invitation-templates/roselle/roselle-template.tsx \
            src/modules/invitation-templates/aruna/aruna-template.tsx \
            src/modules/invitation-templates/laras/laras-template.tsx \
            src/modules/invitation-templates/invitation-template.keys.ts \
            src/modules/invitation-templates/invitation-template.types.ts \
            src/modules/invitation-templates/invitation-template-parity.ts \
            src/modules/invitation-templates/invitation-template.registry.ts \
            src/modules/invitation-templates/invitation-template-renderer.tsx \
            src/components/marketing/theme-catalog.ts \
            src/components/marketing/flagship-marketing.tsx \
            src/components/projects/project-setup-form.tsx \
            tests/unit/invitation-theme-package-registry.test.ts

      - name: TypeScript
        run: npm run typecheck

      - name: Package architecture contract
        run: npx vitest run tests/unit/invitation-theme-package-registry.test.ts

      - name: Production build
        run: npm run build

      - name: Commit validated V4C source
        run: |
          rm scripts/apply-v4c.py
          rm .github/workflows/v4c-canonical-theme-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SERAYA — Canonical Theme Package Architecture V4C"
          git push origin HEAD:agent/canonical-theme-package-architecture-v4c
