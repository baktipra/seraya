name: Install owner hero film once

on:
  pull_request:
    paths:
      - '.github/workflows/install-owner-hero-film-once.yml'

permissions:
  contents: write

jobs:
  install:
    if: github.event.pull_request.head.ref == 'agent/homepage-hero-surface-motion-v3-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/homepage-hero-surface-motion-v3-1
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download owner attachment
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://github.com/user-attachments/assets/23f27731-27df-499c-87c6-0205765fcde0' \
            -o /tmp/owner-hero-source.mp4

          SOURCE_SIZE=$(stat -c%s /tmp/owner-hero-source.mp4)
          echo "source_size=${SOURCE_SIZE}"
          test "${SOURCE_SIZE}" -gt 1000000

      - name: Verify and prepare web video
        run: |
          set -euo pipefail

          SOURCE_DURATION=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/owner-hero-source.mp4)
          SOURCE_WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 /tmp/owner-hero-source.mp4)
          SOURCE_HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 /tmp/owner-hero-source.mp4)
          SOURCE_CODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 /tmp/owner-hero-source.mp4)

          echo "source_duration=${SOURCE_DURATION}"
          echo "source_geometry=${SOURCE_WIDTH}x${SOURCE_HEIGHT}"
          echo "source_codec=${SOURCE_CODEC}"

          awk -v d="${SOURCE_DURATION}" 'BEGIN { exit !(d >= 7 && d <= 9) }'
          test "${SOURCE_WIDTH}" = "1280"
          test "${SOURCE_HEIGHT}" = "720"
          test "${SOURCE_CODEC}" = "h264"

          ffmpeg -y \
            -i /tmp/owner-hero-source.mp4 \
            -map 0:v:0 \
            -c:v copy \
            -an \
            -movflags +faststart \
            public/marketing/hero/seraya-wedding-editorial-loop.mp4

          FINAL_SIZE=$(stat -c%s public/marketing/hero/seraya-wedding-editorial-loop.mp4)
          FINAL_DURATION=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 public/marketing/hero/seraya-wedding-editorial-loop.mp4)
          FINAL_AUDIO_STREAMS=$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 public/marketing/hero/seraya-wedding-editorial-loop.mp4 | wc -l)
          FINAL_SHA=$(sha256sum public/marketing/hero/seraya-wedding-editorial-loop.mp4 | cut -d' ' -f1)

          echo "final_size=${FINAL_SIZE}"
          echo "final_duration=${FINAL_DURATION}"
          echo "final_audio_streams=${FINAL_AUDIO_STREAMS}"
          echo "final_sha256=${FINAL_SHA}"

          test "${FINAL_SIZE}" -gt 1000000
          awk -v d="${FINAL_DURATION}" 'BEGIN { exit !(d >= 7 && d <= 9) }'
          test "${FINAL_AUDIO_STREAMS}" = "0"

      - name: Commit verified binary
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/marketing/hero/seraya-wedding-editorial-loop.mp4
          git commit -m "SERAYA — Install verified owner hero film"
          git push origin HEAD:agent/homepage-hero-surface-motion-v3-1
