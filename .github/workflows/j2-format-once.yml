name: J2 format once

on:
  push:
    branches:
      - agent/j2-live-cross-template-evidence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/j2-live-cross-template-evidence
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format J2 files
        run: npx prettier --write docs/audits/J2-LIVE-CROSS-TEMPLATE-PRODUCTION-EVIDENCE-V1.md scripts/audit-live-cross-template-evidence.mjs

      - name: Commit formatted files
        run: |
          git config user.name "seraya-j2-format-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/audits/J2-LIVE-CROSS-TEMPLATE-PRODUCTION-EVIDENCE-V1.md scripts/audit-live-cross-template-evidence.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: normalize J2 evidence files"
          git push origin HEAD:agent/j2-live-cross-template-evidence
