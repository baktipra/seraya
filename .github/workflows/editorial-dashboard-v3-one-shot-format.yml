name: Editorial Dashboard V3 one-shot format

on:
  push:
    branches:
      - feature/owner-workspace-editorial-dashboard-v3
    paths:
      - '.github/workflows/editorial-dashboard-v3-one-shot-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owner-workspace-editorial-dashboard-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier
        run: |
          npx prettier --write \
            src/components/dashboard/dashboard-shell.tsx \
            src/components/projects/project-overview-bootstrap.tsx \
            src/components/projects/project-overview-bootstrap.module.css \
            tests/unit/owner-workspace-radical-simplicity-v2.test.ts \
            tests/e2e/owner-workspace-radical-simplicity-v2.spec.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/dashboard/dashboard-shell.tsx \
            src/components/projects/project-overview-bootstrap.tsx \
            src/components/projects/project-overview-bootstrap.module.css \
            tests/unit/owner-workspace-radical-simplicity-v2.test.ts \
            tests/e2e/owner-workspace-radical-simplicity-v2.spec.ts
          git commit -m "SERAYA V3: apply repository formatting"
          git push origin HEAD:feature/owner-workspace-editorial-dashboard-v3
