name: P0-A5 apply product commit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/p0-a5-editor-runtime-recovery

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.head_ref == 'agent/p0-a5-editor-runtime-recovery' ||
      github.ref_name == 'agent/p0-a5-editor-runtime-recovery')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-a5-editor-runtime-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify and extract product archive
        shell: bash
        run: |
          set -euo pipefail
          echo 'd9af6ebf96b3b5df4c3127f751ab4e826ec04b9d2fff9ea61c3afe85794ce3d5  .p0-a5-product.tar.gz' | sha256sum --check
          tar -tzf .p0-a5-product.tar.gz > /tmp/p0-a5-files.txt
          tar -xzf .p0-a5-product.tar.gz
      - name: Install dependencies
        run: npm ci
      - name: Format product files
        shell: bash
        run: |
          set -euo pipefail
          tr '\n' '\0' < /tmp/p0-a5-files.txt | xargs -0 npx prettier --write
      - name: Run A5 structural audit
        run: npm run audit:p0-a5:editor-runtime
      - name: Run focused tests
        run: >-
          npx vitest run
          tests/server/editor-runtime-recovery-contract.test.ts
          tests/server/invitation-editor-ui.test.tsx
          tests/server/dashboard-invitation-editor-route.test.tsx
          src/modules/invitations/__tests__/invitation-editor.schema.test.ts
          src/modules/invitations/__tests__/invitation-editor.actions.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit validated product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .p0-a5-product.tar.gz .github/workflows/p0-a5-source-snapshot.yml
          git add -A
          git diff --cached --check
          git commit -m 'SERAYA — P0-A5 editor runtime recovery V1'
          git push origin HEAD:agent/p0-a5-editor-runtime-recovery
