name: P0-A4 apply implementation once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/p0-a4-readiness-aggregation-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-a4-readiness-aggregation-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply A4 patch
        run: |
          python <<'PY'
          import base64
          import glob
          from pathlib import Path

          decoded = bytearray()
          for path in sorted(glob.glob('.p0-a4/patch.b64.*')):
              raw = ''.join(Path(path).read_text().split())
              try:
                  decoded.extend(base64.b64decode(raw, validate=True))
              except Exception as error:
                  raise SystemExit(f'Invalid Base64 staging chunk {path}: {error}')
          Path('/tmp/p0-a4.patch').write_bytes(decoded)
          PY
          git apply --check /tmp/p0-a4.patch
          git apply /tmp/p0-a4.patch
          rm -rf .p0-a4
          rm -f .github/workflows/p0-a4-apply-once.yml
      - name: Format changed files
        run: |
          npx prettier --write \
            package.json \
            scripts/audit-readiness-aggregation-recovery.mjs \
            scripts/audit-workspace-performance-baseline.mjs \
            "src/app/(dashboard)/dashboard/[projectId]/invitation/page.tsx" \
            src/modules/readiness/index.ts \
            src/modules/readiness/wedding-readiness.repository.ts \
            src/modules/readiness/wedding-readiness.service.ts \
            src/modules/readiness/wedding-readiness.types.ts \
            src/modules/readiness/__tests__/wedding-readiness.repository.test.ts \
            src/modules/readiness/__tests__/wedding-readiness.service.test.ts \
            tests/server/dashboard-invitation-editor-route.test.tsx \
            tests/server/readiness-aggregation-recovery-contract.test.ts \
            tests/server/workspace-navigation-data-boundary-recovery-contract.test.ts \
            tests/server/workspace-performance-instrumentation-contract.test.ts \
            docs/audits/P0-A4-READINESS-AGGREGATION-RECOVERY-V1.md
      - name: Focused validation
        run: |
          npm run audit:p0-a4:readiness
          npm run audit:p0-a1:workspace-performance
          npx vitest run \
            src/modules/readiness/__tests__/wedding-readiness.repository.test.ts \
            src/modules/readiness/__tests__/wedding-readiness.service.test.ts \
            tests/server/dashboard-invitation-editor-route.test.tsx \
            tests/server/readiness-aggregation-recovery-contract.test.ts \
            tests/server/workspace-navigation-data-boundary-recovery-contract.test.ts \
            tests/server/workspace-performance-instrumentation-contract.test.ts
          npm run typecheck
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SERAYA — P0-A4 readiness aggregation recovery V1"
          git push origin HEAD:agent/p0-a4-readiness-aggregation-recovery
