name: Homepage preview normalizer

on:
  push:
    branches:
      - agent/homepage-flagship-maturity-v1

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[homepage-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/homepage-flagship-maturity-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize focused homepage files
        run: npx prettier --write src/components/marketing/flagship-marketing.tsx src/components/marketing/flagship-marketing.module.css

      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/marketing/flagship-marketing.tsx src/components/marketing/flagship-marketing.module.css
          git commit -m "SERAYA — Normalize homepage product theater [homepage-normalized]"
          git push origin HEAD:agent/homepage-flagship-maturity-v1
