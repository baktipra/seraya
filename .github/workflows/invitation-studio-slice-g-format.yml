name: Invitation Studio Slice G one-time formatter

on:
  push:
    branches:
      - feature/invitation-studio-slice-g-responsive-polish
    paths:
      - '.github/workflows/invitation-studio-slice-g-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/invitation-studio-slice-g-responsive-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Slice G validation files and remove this workflow
        run: |
          npx prettier --write \
            src/components/projects/invitation-studio-responsive-polish.module.css \
            tests/unit/invitation-studio-responsive-slice-g.test.tsx \
            tests/e2e/invitation-studio-responsive-slice-g.spec.ts \
            tests/e2e/fixture-app/app/invitation-studio-slice-g/page.tsx
          rm .github/workflows/invitation-studio-slice-g-format.yml
      - name: Commit normalized files
        run: |
          git config user.name seraya-release-bot
          git config user.email 88146860+baktipra@users.noreply.github.com
          git add \
            src/components/projects/invitation-studio-responsive-polish.module.css \
            tests/unit/invitation-studio-responsive-slice-g.test.tsx \
            tests/e2e/invitation-studio-responsive-slice-g.spec.ts \
            tests/e2e/fixture-app/app/invitation-studio-slice-g/page.tsx \
            .github/workflows/invitation-studio-slice-g-format.yml
          git commit -m 'SERAYA Slice G: normalize responsive validation formatting'
          git push origin HEAD:feature/invitation-studio-slice-g-responsive-polish
