name: Normalize hero film once

on:
  pull_request:
    paths:
      - '.github/workflows/normalize-hero-film-once.yml'
      - 'src/components/marketing/editorial-hero.tsx'
      - 'src/components/marketing/editorial-hero.module.css'

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'agent/homepage-hero-surface-motion-v3-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/homepage-hero-surface-motion-v3-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize hero film files
        run: |
          npx prettier --write \
            src/components/marketing/editorial-hero.tsx \
            src/components/marketing/editorial-hero.module.css
      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/marketing/editorial-hero.tsx \
            src/components/marketing/editorial-hero.module.css
          git commit -m "SERAYA — Normalize editorial hero film"
          git push origin HEAD:agent/homepage-hero-surface-motion-v3-1
