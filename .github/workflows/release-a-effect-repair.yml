name: Release A guided-step effect repair

on:
  push:
    branches:
      - agent/release-a-flagship-experience

permissions:
  contents: write

jobs:
  repair-effect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-a-flagship-experience

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Schedule server-error step recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/projects/project-setup-form.tsx')
          content = path.read_text()
          pattern = re.compile(r"  useEffect\(\(\) => \{\n.*?\n  \}, \[\n", re.DOTALL)
          replacement = (
              "  useEffect(() => {\n"
              "    if (state.status !== 'error') return undefined;\n\n"
              "    let recoveryStep: SetupStep | null = null;\n\n"
              "    if (\n"
              "      errors.personOneName ||\n"
              "      errors.personTwoName ||\n"
              "      errors.eventDatePrimary ||\n"
              "      errors.eventCity\n"
              "    ) {\n"
              "      recoveryStep = 1;\n"
              "    } else if (errors.templateKey) {\n"
              "      recoveryStep = 2;\n"
              "    } else if (errors.slug) {\n"
              "      recoveryStep = 3;\n"
              "    }\n\n"
              "    if (!recoveryStep) return undefined;\n\n"
              "    const recoveryFrame = window.requestAnimationFrame(() => {\n"
              "      setStep(recoveryStep);\n"
              "    });\n\n"
              "    return () => window.cancelAnimationFrame(recoveryFrame);\n"
              "  }, [\n"
          )
          updated, count = pattern.subn(replacement, content, count=1)
          if count != 1:
              raise SystemExit(f'Expected one guided-step effect block, found {count}.')
          path.write_text(updated)
          PY

      - name: Format repaired file
        run: npx prettier --write src/components/projects/project-setup-form.tsx

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'Guided-step effect already repaired.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/projects/project-setup-form.tsx
          git commit -m 'Schedule guided-step server error recovery'
          git push origin HEAD:agent/release-a-flagship-experience
