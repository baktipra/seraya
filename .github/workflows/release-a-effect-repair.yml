name: Release A guided-step effect repair

on:
  push:
    branches:
      - agent/release-a-flagship-experience

permissions:
  contents: write

jobs:
  repair-effect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-a-flagship-experience

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Schedule server-error step recovery
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/projects/project-setup-form.tsx')
          content = path.read_text()
          old = """  useEffect(() => {
    if (state.status !== 'error') return;

    if (
      errors.personOneName ||
      errors.personTwoName ||
      errors.eventDatePrimary ||
      errors.eventCity
    ) {
      setStep(1);
      return;
    }

    if (errors.templateKey) {
      setStep(2);
      return;
    }

    if (errors.slug) {
      setStep(3);
    }
  }, [
"""
          new = """  useEffect(() => {
    if (state.status !== 'error') return undefined;

    let recoveryStep: SetupStep | null = null;

    if (
      errors.personOneName ||
      errors.personTwoName ||
      errors.eventDatePrimary ||
      errors.eventCity
    ) {
      recoveryStep = 1;
    } else if (errors.templateKey) {
      recoveryStep = 2;
    } else if (errors.slug) {
      recoveryStep = 3;
    }

    if (!recoveryStep) return undefined;

    const recoveryFrame = window.requestAnimationFrame(() => {
      setStep(recoveryStep);
    });

    return () => window.cancelAnimationFrame(recoveryFrame);
  }, [
"""
          if old not in content:
              raise SystemExit('Expected guided-step effect block was not found.')
          path.write_text(content.replace(old, new))
          PY

      - name: Format repaired file
        run: npx prettier --write src/components/projects/project-setup-form.tsx

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/projects/project-setup-form.tsx
          git commit -m 'Schedule guided-step server error recovery'
          git push origin HEAD:agent/release-a-flagship-experience
