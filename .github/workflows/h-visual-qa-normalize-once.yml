name: H visual QA normalize once

on:
  push:
    branches:
      - agent/visual-qa-hardening-v1

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[h-normalized]') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/visual-qa-hardening-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize H files
        run: |
          npx prettier --write \
            .github/workflows/visual-qa-hardening.yml \
            package.json \
            playwright.visual-qa.config.ts \
            src/modules/invitation-templates/invitation-template-parity-boundary.module.css \
            tests/e2e/visual-qa-hardening.spec.ts

      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/visual-qa-hardening.yml \
            package.json \
            playwright.visual-qa.config.ts \
            src/modules/invitation-templates/invitation-template-parity-boundary.module.css \
            tests/e2e/visual-qa-hardening.spec.ts
          git commit -m "SERAYA — Normalize H visual QA files [h-normalized]"
          git push origin HEAD:agent/visual-qa-hardening-v1
