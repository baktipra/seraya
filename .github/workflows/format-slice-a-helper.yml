name: Slice A format helper

on:
  push:
    branches:
      - agent/follow-up-slice-a-domain-persistence

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Slice A files
        run: >-
          npx prettier --write
          package.json
          src/modules/follow-up/follow-up.repository.ts
          src/modules/follow-up/follow-up.service.ts
          src/modules/follow-up/follow-up.types.ts
          src/modules/follow-up/follow-up.validation.ts
          tests/integration/guest-follow-up-foundation.test.ts
          tests/server/guest-follow-up-foundation.test.ts

      - name: Package formatted files
        run: |
          tar -czf formatted-slice-a.tar.gz \
            package.json \
            src/modules/follow-up/follow-up.repository.ts \
            src/modules/follow-up/follow-up.service.ts \
            src/modules/follow-up/follow-up.types.ts \
            src/modules/follow-up/follow-up.validation.ts \
            tests/integration/guest-follow-up-foundation.test.ts \
            tests/server/guest-follow-up-foundation.test.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-slice-a
          path: formatted-slice-a.tar.gz
          if-no-files-found: error
          retention-days: 1
