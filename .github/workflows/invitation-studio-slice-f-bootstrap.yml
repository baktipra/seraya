name: Apply Invitation Studio Slice F

on:
  push:
    branches:
      - feature/invitation-studio-slice-f-publish-decision-authority
    paths:
      - 'tools/apply-invitation-studio-slice-f.py'
      - '.github/workflows/invitation-studio-slice-f-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/invitation-studio-slice-f-publish-decision-authority
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python tools/apply-invitation-studio-slice-f.py
      - run: rm tools/apply-invitation-studio-slice-f.py
      - name: Format focused source
        run: |
          npx prettier --write \
            'src/app/(dashboard)/dashboard/[projectId]/invitation/page.tsx' \
            src/components/projects/invitation-studio-publish-mode.tsx \
            src/components/projects/invitation-studio-publish-mode.module.css
      - name: Lint focused source
        run: |
          npx eslint \
            'src/app/(dashboard)/dashboard/[projectId]/invitation/page.tsx' \
            src/components/projects/invitation-studio-publish-mode.tsx
      - run: npm run typecheck
      - name: Run prior Slice and publication contracts
        run: |
          npx vitest run \
            tests/unit/invitation-studio-structural-foundation-slice-a.test.tsx \
            tests/unit/invitation-studio-unified-state-slice-b.test.ts \
            tests/unit/invitation-studio-design-mode-slice-c.test.ts \
            tests/unit/invitation-studio-media-mode-slice-d.test.ts \
            tests/unit/invitation-studio-preview-mode-slice-e.test.ts \
            src/modules/publications/__tests__/publication.service.test.ts \
            src/modules/payments/__tests__/payment-publish-policy.test.ts
      - run: npm run build
      - name: Commit Slice F source implementation
        run: |
          git config user.name "seraya-release-bot"
          git config user.email "88146860+baktipra@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "SERAYA Slice F: activate Publish Mode decision authority"
          git push origin HEAD:feature/invitation-studio-slice-f-publish-decision-authority
