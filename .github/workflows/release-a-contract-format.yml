name: Release A contract format

on:
  push:
    branches:
      - agent/release-a-flagship-experience

permissions:
  contents: write

jobs:
  format-release-a-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-a-flagship-experience

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Release A contracts
        run: |
          npx prettier --write \
            .github/workflows/release-a-regression.yml \
            tests/server/release-a-guided-entry-workspace-contract.test.ts \
            src/modules/projects/__tests__/create-project.schema.test.ts \
            src/modules/projects/__tests__/create-project.service.test.ts

      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo 'Release A contract files already use canonical formatting.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/release-a-regression.yml \
            tests/server/release-a-guided-entry-workspace-contract.test.ts \
            src/modules/projects/__tests__/create-project.schema.test.ts \
            src/modules/projects/__tests__/create-project.service.test.ts
          git commit -m 'Format Release A regression contracts'
          git push origin HEAD:agent/release-a-flagship-experience
