name: RC2 guest control confidence validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/components/projects/guest-control-confidence.tsx'
      - 'src/components/projects/project-overview-bootstrap.tsx'
      - 'src/modules/readiness/guest-control-confidence.ts'
      - 'src/modules/readiness/index.ts'
      - 'tests/unit/guest-control-confidence-rc2.test.tsx'
      - 'tests/e2e/guest-control-confidence-rc2.spec.ts'
      - 'tests/e2e/fixture-app/app/rc2-guest-control/**'
      - 'playwright.rc2.config.ts'
      - '.github/workflows/rc2-guest-control-confidence.yml'
  push:
    branches:
      - feature/rc2-guest-control-link-lifecycle-confidence-v1
    paths:
      - 'src/components/projects/guest-control-confidence.tsx'
      - 'src/components/projects/project-overview-bootstrap.tsx'
      - 'src/modules/readiness/guest-control-confidence.ts'
      - 'src/modules/readiness/index.ts'
      - 'tests/unit/guest-control-confidence-rc2.test.tsx'
      - 'tests/e2e/guest-control-confidence-rc2.spec.ts'
      - 'tests/e2e/fixture-app/app/rc2-guest-control/**'
      - 'playwright.rc2.config.ts'
      - '.github/workflows/rc2-guest-control-confidence.yml'

concurrency:
  group: rc2-guest-control-confidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check focused formatting
        run: |
          npx prettier --check \
            src/components/projects/guest-control-confidence.tsx \
            src/components/projects/project-overview-bootstrap.tsx \
            src/modules/readiness/guest-control-confidence.ts \
            src/modules/readiness/index.ts \
            tests/unit/guest-control-confidence-rc2.test.tsx \
            tests/e2e/guest-control-confidence-rc2.spec.ts \
            tests/e2e/fixture-app/app/rc2-guest-control/page.tsx \
            playwright.rc2.config.ts \
            .github/workflows/rc2-guest-control-confidence.yml
      - name: Lint focused source
        run: |
          npx eslint \
            src/components/projects/guest-control-confidence.tsx \
            src/components/projects/project-overview-bootstrap.tsx \
            src/modules/readiness/guest-control-confidence.ts \
            src/modules/readiness/index.ts \
            tests/unit/guest-control-confidence-rc2.test.tsx \
            tests/e2e/guest-control-confidence-rc2.spec.ts \
            tests/e2e/fixture-app/app/rc2-guest-control/page.tsx \
            playwright.rc2.config.ts
      - run: npm run typecheck
      - name: Run focused contracts
        run: npx vitest run tests/unit/guest-control-confidence-rc2.test.tsx tests/unit/published-confidence-rc1.test.tsx
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile Ringkasan smoke
        run: npx playwright test --config=playwright.rc2.config.ts
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-guest-control-confidence-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
