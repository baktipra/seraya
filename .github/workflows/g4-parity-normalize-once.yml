name: G4 parity normalize once

on:
  push:
    branches:
      - agent/cross-template-parity-v1

permissions:
  contents: write

jobs:
  normalize-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[g4-normalized]') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/cross-template-parity-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize G4 and invitation experience files
        run: |
          npx prettier --write \
            src/modules/invitation-templates/__tests__/cross-template-parity-v1.test.ts \
            src/modules/invitation-templates/invitation-template-parity-boundary.module.css \
            src/modules/invitation-templates/invitation-template-parity-boundary.tsx \
            src/modules/invitation-templates/invitation-template-parity.ts \
            src/modules/invitation-templates/invitation-template-renderer.tsx \
            src/modules/invitation-templates/invitation-template.registry.ts \
            src/modules/invitation-templates/roselle/roselle-sections.tsx \
            src/modules/invitation-templates/aruna/aruna-template.tsx \
            src/modules/invitation-templates/laras/laras-template.tsx

      - name: Lint G4 source
        run: |
          npx eslint \
            src/modules/invitation-templates/__tests__/cross-template-parity-v1.test.ts \
            src/modules/invitation-templates/invitation-template-parity-boundary.tsx \
            src/modules/invitation-templates/invitation-template-parity.ts \
            src/modules/invitation-templates/invitation-template-renderer.tsx \
            src/modules/invitation-templates/invitation-template.registry.ts

      - name: Run G4 parity matrix
        run: npx vitest run src/modules/invitation-templates/__tests__/cross-template-parity-v1.test.ts

      - name: Build production application
        run: npm run build

      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/modules/invitation-templates/__tests__/cross-template-parity-v1.test.ts \
            src/modules/invitation-templates/invitation-template-parity-boundary.module.css \
            src/modules/invitation-templates/invitation-template-parity-boundary.tsx \
            src/modules/invitation-templates/invitation-template-parity.ts \
            src/modules/invitation-templates/invitation-template-renderer.tsx \
            src/modules/invitation-templates/invitation-template.registry.ts \
            src/modules/invitation-templates/roselle/roselle-sections.tsx \
            src/modules/invitation-templates/aruna/aruna-template.tsx \
            src/modules/invitation-templates/laras/laras-template.tsx
          git commit -m "SERAYA — Normalize G4 parity formatting [g4-normalized]"
          git push origin HEAD:agent/cross-template-parity-v1
