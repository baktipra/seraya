name: P0 B3 format once

on:
  push:
    branches:
      - agent/p0-b3-template-quality-bar-maturation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-b3-template-quality-bar-maturation

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format P0-B3 source
        run: |
          npx prettier --write \
            src/app/invitation-template-quality-bar.css \
            src/modules/invitation-templates/__tests__/invitation-template-quality-bar-contract.test.ts

      - name: Commit formatted output
        run: |
          if git diff --quiet; then
            echo "No formatting changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/invitation-template-quality-bar.css \
            src/modules/invitation-templates/__tests__/invitation-template-quality-bar-contract.test.ts
          git commit -m "P0-B3: format quality-bar source"
          git push origin HEAD:agent/p0-b3-template-quality-bar-maturation
