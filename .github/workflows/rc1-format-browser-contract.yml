name: RC1 format browser contract

on:
  push:
    branches:
      - feature/rc1-slice-a-published-confidence-post-publish-entry
    paths:
      - '.github/workflows/rc1-format-browser-contract.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rc1-slice-a-published-confidence-post-publish-entry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/published-confidence-rc1.spec.ts
      - name: Commit exact formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/published-confidence-rc1.spec.ts
          git commit -m "SERAYA RC1: format published confidence browser contract"
          git push origin HEAD:feature/rc1-slice-a-published-confidence-post-publish-entry
