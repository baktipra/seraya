name: Apply marketing shell V4A through Release A

on:
  pull_request:
    paths:
      - '.github/workflows/release-a-regression.yml'

permissions:
  contents: write

jobs:
  apply-v4a:
    if: github.event.pull_request.head.ref == 'agent/gen-z-theme-discovery-v4a-fixed-shell' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gen-z-theme-discovery-v4a-fixed-shell
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Execute V4A transformer
        run: |
          python <<'RUNNER'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-marketing-shell-v4a-once.yml').read_text(
              encoding='utf-8'
          )
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('V4A transformer block not found')
          code = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(code), '<v4a-transformer>', 'exec'))
          RUNNER
      - name: Normalize focused V4A files
        run: |
          npx prettier --write \
            src/components/marketing/marketing-page-shell.tsx \
            src/components/marketing/editorial-hero.tsx \
            src/components/marketing/editorial-hero.module.css \
            src/app/page.tsx \
            src/app/templates/page.tsx \
            tests/e2e/homepage-product-theater.spec.ts \
            tests/e2e/marketing-fixed-shell.spec.ts
      - name: Validate focused V4A source
        run: |
          npx eslint \
            src/components/marketing/marketing-page-shell.tsx \
            src/components/marketing/editorial-hero.tsx \
            src/app/page.tsx \
            src/app/templates/page.tsx \
            tests/e2e/homepage-product-theater.spec.ts \
            tests/e2e/marketing-fixed-shell.spec.ts
          npm run build
      - name: Restore workflows and commit V4A
        run: |
          git show origin/main:.github/workflows/release-a-regression.yml > .github/workflows/release-a-regression.yml
          git rm .github/workflows/apply-marketing-shell-v4a-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/release-a-regression.yml \
            src/components/marketing/marketing-page-shell.tsx \
            src/components/marketing/editorial-hero.tsx \
            src/components/marketing/editorial-hero.module.css \
            src/app/page.tsx \
            src/app/templates/page.tsx \
            tests/e2e/homepage-product-theater.spec.ts \
            tests/e2e/marketing-fixed-shell.spec.ts
          git commit -m "SERAYA — Unified Fixed-Width Marketing Shell V4A"
          git push origin HEAD:agent/gen-z-theme-discovery-v4a-fixed-shell