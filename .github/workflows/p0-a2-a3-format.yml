name: P0-A2-A3 format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format recovery files
        run: >-
          npx prettier --write
          'src/app/(dashboard)/dashboard/[projectId]/loading.tsx'
          src/components/dashboard/project-navigation.tsx
          tests/server/dashboard-delivery-route.test.tsx
      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/(dashboard)/dashboard/[projectId]/loading.tsx' \
            src/components/dashboard/project-navigation.tsx \
            tests/server/dashboard-delivery-route.test.tsx
          git commit -m "chore: apply P0-A2/A3 formatting"
          git push
