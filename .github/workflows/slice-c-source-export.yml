name: Slice C source export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/follow-up-slice-c-manual-reminder-handoff

      - name: Package source outside checkout
        run: |
          tar --exclude=.git --exclude=node_modules -czf ../seraya-slice-c-source.tgz .

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: slice-c-source-export
          path: ../seraya-slice-c-source.tgz
          retention-days: 1
