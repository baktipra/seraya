name: P0-A5 production runtime evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  measure:
    if: github.head_ref == 'agent/p0-a5-editor-runtime-recovery'
    runs-on: ubuntu-latest
    env:
      BEFORE_SHA: eba8bdbc0ed0b3f7aed5c6ea5d5a41467d4ab535
    steps:
      - name: Check out A5 head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare before and after fixture apps
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/seraya-before "$BEFORE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/seraya-before/node_modules

          prepare_fixture() {
            local root="$1"
            local fixture="$root/tests/e2e/editor-runtime-fixture"
            mkdir -p "$fixture/app"

            cat > "$fixture/app/layout.tsx" <<'TSX'
          import { ToastProvider } from '@/design-system';

          import '../../../../src/app/globals.css';
          import '../../../../src/app/flagship-release-a.css';
          import '../../../../src/app/workspace-anatomy.css';
          import '../../../../src/app/workspace-responsive.css';
          import '../../../../src/app/accessibility-release.css';
          import '../../../../src/app/personal-response-release.css';
          import '../../../../src/app/invitation-maturation-release.css';
          import '../../../../src/app/invitation-opening-maturation-release.css';
          import '../../../../src/app/invitation-media-release.css';
          import '../../../../src/app/roselle-flagship-maturation-release.css';

          export default function EditorRuntimeFixtureLayout({
            children,
          }: Readonly<{ children: React.ReactNode }>) {
            return (
              <html lang="id" className="bg-seraya-ivory h-full">
                <body className="min-h-full antialiased">
                  <ToastProvider>{children}</ToastProvider>
                </body>
              </html>
            );
          }
          TSX

            cat > "$fixture/app/page.tsx" <<'TSX'
          import { InvitationEditor } from '@/components/projects/invitation-editor';
          import { createDefaultInvitationDraftContent } from '@/modules/invitations/invitation-draft.defaults';
          import type { InvitationDraft } from '@/modules/invitations/invitation-draft.types';

          const project = {
            account_id: '11111111-1111-1111-1111-111111111111',
            default_timezone: 'Asia/Jakarta',
            deleted_at: null,
            event_city: 'Jakarta',
            event_date_primary: '2027-08-17',
            id: 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa',
            person_one_name: 'Raka',
            person_two_name: 'Nadia',
            slug: 'raka-nadia',
            status: 'draft' as const,
          };

          const content = createDefaultInvitationDraftContent(project);
          content.templateKey = 'roselle';
          content.hero.title = 'Raka & Nadia';
          content.hero.subtitle = 'Dengan penuh syukur kami mengundang Anda.';

          const draft: InvitationDraft = {
            content,
            created_at: '2026-06-20T00:00:00.000Z',
            deleted_at: null,
            id: 'draft-private-id',
            project_id: project.id,
            schema_version: 1,
            updated_at: '2026-06-20T00:00:00.000Z',
          };

          export default function EditorRuntimeFixturePage() {
            return (
              <main className="mx-auto min-h-screen max-w-[96rem] px-4 py-6 sm:px-6">
                <InvitationEditor
                  draft={draft}
                  galleryImages={[]}
                  project={{ event_date_primary: project.event_date_primary }}
                  projectId={project.id}
                />
              </main>
            );
          }
          TSX

            cat > "$fixture/next.config.ts" <<'TS'
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          import type { NextConfig } from 'next';

          const fixtureDirectory = path.dirname(fileURLToPath(import.meta.url));

          const nextConfig: NextConfig = {
            poweredByHeader: false,
            reactStrictMode: true,
            turbopack: {
              root: path.resolve(fixtureDirectory, '../../..'),
            },
          };

          export default nextConfig;
          TS

            cat > "$fixture/postcss.config.mjs" <<'MJS'
          export { default } from '../../../postcss.config.mjs';
          MJS

            cat > "$fixture/tsconfig.json" <<'JSON'
          {
            "extends": "../../../tsconfig.json",
            "compilerOptions": {
              "baseUrl": "../../..",
              "paths": {
                "@/*": ["src/*"]
              }
            },
            "include": [
              "app/**/*.ts",
              "app/**/*.tsx",
              ".next/types/**/*.ts",
              ".next/dev/types/**/*.ts"
            ]
          }
          JSON
          }

          prepare_fixture "$GITHUB_WORKSPACE"
          prepare_fixture /tmp/seraya-before

      - name: Build production fixture apps
        shell: bash
        run: |
          set -euo pipefail
          npx next build tests/e2e/editor-runtime-fixture
          (
            cd /tmp/seraya-before
            "$GITHUB_WORKSPACE/node_modules/.bin/next" build tests/e2e/editor-runtime-fixture
          )

      - name: Start production fixture apps
        shell: bash
        run: |
          set -euo pipefail
          nohup npx next start tests/e2e/editor-runtime-fixture -p 3102 > /tmp/a5-after.log 2>&1 &
          echo $! > /tmp/a5-after.pid
          (
            cd /tmp/seraya-before
            nohup "$GITHUB_WORKSPACE/node_modules/.bin/next" start tests/e2e/editor-runtime-fixture -p 3101 > /tmp/a5-before.log 2>&1 &
            echo $! > /tmp/a5-before.pid
          )

          for port in 3101 3102; do
            for attempt in $(seq 1 60); do
              if curl --fail --silent "http://127.0.0.1:${port}" > /dev/null; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                cat /tmp/a5-before.log || true
                cat /tmp/a5-after.log || true
                exit 1
              fi
              sleep 1
            done
          done

      - name: Capture desktop and Pixel 7 runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/measure-p0-a5-runtime.mjs <<'MJS'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { chromium, devices } from '@playwright/test';

          const targets = [
            { key: 'before', url: 'http://127.0.0.1:3101' },
            { key: 'after', url: 'http://127.0.0.1:3102' },
          ];
          const profiles = [
            { key: 'desktop', options: { viewport: { height: 900, width: 1440 } } },
            { key: 'mobile', options: devices['Pixel 7'] },
          ];

          function percentile(values, fraction) {
            const sorted = [...values].sort((left, right) => left - right);
            return sorted[Math.max(0, Math.ceil(sorted.length * fraction) - 1)];
          }

          async function clickVisibleOpeningButton(page) {
            const buttons = page.getByRole('button', { exact: true, name: 'Pembuka' });
            const count = await buttons.count();
            for (let index = 0; index < count; index += 1) {
              const button = buttons.nth(index);
              if (await button.isVisible()) {
                await button.click();
                return;
              }
            }
            throw new Error('No visible Pembuka chapter button.');
          }

          const browser = await chromium.launch();
          const rows = [];

          try {
            for (const target of targets) {
              for (const profile of profiles) {
                for (let sample = 1; sample <= 3; sample += 1) {
                  const context = await browser.newContext(profile.options);
                  const page = await context.newPage();
                  const runtimeEvents = [];
                  page.on('console', (message) => {
                    try {
                      const payload = JSON.parse(message.text());
                      if (payload.source === 'invitation-editor-performance') {
                        runtimeEvents.push(payload);
                      }
                    } catch {
                      // Ignore unrelated browser logs.
                    }
                  });

                  await page.goto(target.url, { waitUntil: 'domcontentloaded' });
                  const editor = page.locator('[data-dashboard-width="wide"]');
                  await editor.waitFor({ state: 'attached' });

                  const initial = await page.evaluate(() => {
                    const root = document.querySelector('[data-dashboard-width="wide"]');
                    const resources = performance.getEntriesByType('resource');
                    const scripts = resources.filter(
                      (entry) => entry instanceof PerformanceResourceTiming && entry.initiatorType === 'script',
                    );
                    return {
                      domNodeCount: root?.querySelectorAll('*').length ?? 0,
                      mountedPanelCount:
                        root?.querySelectorAll('[data-invitation-editor-panel]').length ?? 0,
                      previewScreenPresent:
                        root?.querySelectorAll('[data-local-preview-screen]').length ?? 0,
                      scriptBytes: scripts.reduce((total, entry) => {
                        const timing = /** @type {PerformanceResourceTiming} */ (entry);
                        return total + (timing.transferSize || timing.encodedBodySize || 0);
                      }, 0),
                      shellAttachedMs: Math.round(performance.now()),
                    };
                  });

                  await clickVisibleOpeningButton(page);
                  await page.locator('input[name="hero.eyebrow"]').waitFor({ state: 'visible' });
                  const chapterReadyMs = await page.evaluate(() => Math.round(performance.now()));
                  const afterChapterSwitch = await page.evaluate(() => {
                    const root = document.querySelector('[data-dashboard-width="wide"]');
                    return {
                      domNodeCount: root?.querySelectorAll('*').length ?? 0,
                      mountedPanelCount:
                        root?.querySelectorAll('[data-invitation-editor-panel]').length ?? 0,
                    };
                  });

                  let mobilePreviewDeferred = null;
                  if (profile.key === 'mobile') {
                    mobilePreviewDeferred = initial.previewScreenPresent === 0;
                    const trigger = page.locator('[data-local-preview-trigger]');
                    await trigger.waitFor({ state: 'visible' });
                    await trigger.click();
                    await page.locator('[data-local-preview-screen]').waitFor({ state: 'visible' });
                  }

                  rows.push({
                    afterChapterSwitch,
                    chapterReadyMs,
                    initial,
                    mobilePreviewDeferred,
                    profile: profile.key,
                    runtimeEvents,
                    sample,
                    target: target.key,
                  });
                  await context.close();
                }
              }
            }
          } finally {
            await browser.close();
          }

          const summary = [];
          for (const target of targets) {
            for (const profile of profiles) {
              const matching = rows.filter(
                (row) => row.target === target.key && row.profile === profile.key,
              );
              const values = (field) => matching.map(field);
              summary.push({
                chapterReadyMedianMs: percentile(values((row) => row.chapterReadyMs), 0.5),
                chapterReadyP75Ms: percentile(values((row) => row.chapterReadyMs), 0.75),
                domNodeMedian: percentile(values((row) => row.initial.domNodeCount), 0.5),
                initialScriptBytesMedian: percentile(values((row) => row.initial.scriptBytes), 0.5),
                mobilePreviewDeferred:
                  profile.key === 'mobile'
                    ? matching.every((row) => row.mobilePreviewDeferred === true)
                    : null,
                mountedPanelMedian: percentile(
                  values((row) => row.initial.mountedPanelCount),
                  0.5,
                ),
                profile: profile.key,
                samples: matching.length,
                shellAttachedMedianMs: percentile(
                  values((row) => row.initial.shellAttachedMs),
                  0.5,
                ),
                target: target.key,
              });
            }
          }

          await mkdir('p0-a5-runtime-evidence', { recursive: true });
          await writeFile(
            'p0-a5-runtime-evidence/evidence.json',
            `${JSON.stringify({ rows, summary }, null, 2)}\n`,
          );
          await writeFile(
            'p0-a5-runtime-evidence/evidence.md',
            [
              '# P0-A5 production runtime evidence',
              '',
              'Both revisions were built and served locally in production mode on the same GitHub Actions runner. Network and database latency are intentionally excluded.',
              '',
              '| Revision | Device | Samples | Shell median | Chapter-ready median / p75 | Mounted panels | DOM nodes | Initial JS bytes | Mobile preview deferred |',
              '|---|---|---:|---:|---:|---:|---:|---:|---|',
              ...summary.map(
                (row) =>
                  `| ${row.target} | ${row.profile} | ${row.samples} | ${row.shellAttachedMedianMs} ms | ${row.chapterReadyMedianMs} / ${row.chapterReadyP75Ms} ms | ${row.mountedPanelMedian} | ${row.domNodeMedian} | ${row.initialScriptBytesMedian} | ${row.mobilePreviewDeferred ?? 'n/a'} |`,
              ),
              '',
            ].join('\n'),
          );
          console.log(JSON.stringify({ summary }, null, 2));
          MJS

          node /tmp/measure-p0-a5-runtime.mjs

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-a5-production-runtime-evidence
          path: p0-a5-runtime-evidence
          retention-days: 1
