name: Apply Invitation Studio Slice E

on:
  push:
    branches:
      - feature/invitation-studio-slice-e-preview-version-truth-authority
    paths:
      - 'tools/apply-invitation-studio-slice-e.py'
      - '.github/workflows/invitation-studio-slice-e-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/invitation-studio-slice-e-preview-version-truth-authority
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Slice E integration
        run: python tools/apply-invitation-studio-slice-e.py
      - name: Remove one-time integration script
        run: rm tools/apply-invitation-studio-slice-e.py
      - name: Format touched source
        run: |
          npx prettier --write \
            'src/app/(dashboard)/dashboard/[projectId]/invitation/page.tsx' \
            src/components/projects/invitation-studio-preview-mode.tsx \
            src/components/projects/invitation-studio-preview-mode.module.css \
            src/components/projects/invitation-studio-preview.types.ts
      - name: Lint focused source
        run: |
          npx eslint \
            'src/app/(dashboard)/dashboard/[projectId]/invitation/page.tsx' \
            src/components/projects/invitation-studio-preview-mode.tsx \
            src/components/projects/invitation-studio-preview.types.ts
      - run: npm run typecheck
      - name: Run prior Slice contracts
        run: |
          npx vitest run \
            tests/unit/invitation-studio-structural-foundation-slice-a.test.tsx \
            tests/unit/invitation-studio-unified-state-slice-b.test.ts \
            tests/unit/invitation-studio-design-mode-slice-c.test.ts \
            tests/unit/invitation-studio-media-mode-slice-d.test.ts
      - run: npm run build
      - name: Commit Slice E source implementation
        run: |
          git config user.name "seraya-release-bot"
          git config user.email "88146860+baktipra@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "SERAYA Slice E: activate Preview Mode version truth"
          git push origin HEAD:feature/invitation-studio-slice-e-preview-version-truth-authority
