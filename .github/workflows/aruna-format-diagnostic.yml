name: Temporary Aruna formatter

on:
  push:
    branches:
      - feature/aruna-flagship-guest-experience-maturation-v1
    paths:
      - '.github/workflows/aruna-format-diagnostic.yml'
      - 'src/app/aruna-flagship-maturation-release.css'
      - 'src/modules/invitation-templates/__tests__/aruna-flagship-guest-experience-contract.test.ts'
      - 'tests/e2e/aruna-flagship-guest-experience.spec.ts'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aruna-flagship-guest-experience-maturation-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format exact milestone files
        run: |
          npx prettier --write \
            src/app/aruna-flagship-maturation-release.css \
            src/modules/invitation-templates/__tests__/aruna-flagship-guest-experience-contract.test.ts \
            tests/e2e/aruna-flagship-guest-experience.spec.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/aruna-flagship-maturation-release.css \
            src/modules/invitation-templates/__tests__/aruna-flagship-guest-experience-contract.test.ts \
            tests/e2e/aruna-flagship-guest-experience.spec.ts
          git commit -m "SERAYA — format Aruna flagship files"
          git push origin HEAD:feature/aruna-flagship-guest-experience-maturation-v1
