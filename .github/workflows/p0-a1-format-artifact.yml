name: P0-A1 formatting artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format P0-A1 files
        run: >-
          npx prettier --write
          docs/audits/P0-A1-WORKSPACE-PERFORMANCE-INSTRUMENTATION-BASELINE-V1.md
          scripts/audit-workspace-performance-baseline.mjs
          src/lib/performance/workspace-performance.client.ts
          tests/server/workspace-performance-instrumentation-contract.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: p0-a1-formatted-files
          path: |
            docs/audits/P0-A1-WORKSPACE-PERFORMANCE-INSTRUMENTATION-BASELINE-V1.md
            scripts/audit-workspace-performance-baseline.mjs
            src/lib/performance/workspace-performance.client.ts
            tests/server/workspace-performance-instrumentation-contract.test.ts
