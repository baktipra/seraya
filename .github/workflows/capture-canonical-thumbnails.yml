name: Capture canonical invitation thumbnails

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/v4g-static-thumbnail-capture
    paths:
      - 'src/app/templates/**'
      - 'src/modules/invitation-templates/**'
      - 'src/components/marketing/canonical-invitation-thumbnail.tsx'
      - 'scripts/capture-canonical-thumbnails.mjs'
      - '.github/workflows/capture-canonical-thumbnails.yml'

permissions:
  contents: write

concurrency:
  group: canonical-invitation-thumbnails
  cancel-in-progress: true

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip thumbnail capture]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Format V4G sources
        run: |
          npx prettier --write \
            scripts/capture-canonical-thumbnails.mjs \
            src/components/marketing/canonical-invitation-thumbnail.tsx \
            src/components/marketing/canonical-thumbnail-capture-status.ts \
            tests/unit/canonical-preview-thumbnail-pipeline.test.ts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install WebP encoder
        run: |
          sudo apt-get update
          sudo apt-get install --yes webp

      - name: Start canonical showroom
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/seraya-thumbnail-server.log 2>&1 &
          echo $! > /tmp/seraya-thumbnail-server.pid
          for attempt in {1..90}; do
            if curl --fail --silent --show-error 'http://127.0.0.1:3000/templates/roselle/demo/generic?palette=rose&embed=thumbnail' > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/seraya-thumbnail-server.log
          exit 1

      - name: Capture renderer snapshots
        run: npm run capture:thumbnails -- --base-url=http://127.0.0.1:3000

      - name: Encode optimized WebP assets
        run: |
          for source in public/invitation-thumbnails/v4g/*.png; do
            destination="${source%.png}.webp"
            cwebp -quiet -q 86 -m 6 "$source" -o "$destination"
            rm "$source"
          done

      - name: Promote optimized capture matrix
        run: |
          cat > src/components/marketing/canonical-thumbnail-capture-status.ts <<'EOF'
          // Generated by .github/workflows/capture-canonical-thumbnails.yml
          export const CANONICAL_THUMBNAIL_WEBP_READY = true as const;
          EOF
          npx prettier --write src/components/marketing/canonical-thumbnail-capture-status.ts

      - name: Verify capture matrix
        run: |
          test "$(find public/invitation-thumbnails/v4g -maxdepth 1 -name '*.webp' | wc -l)" -eq 12
          node -e "const m=require('./public/invitation-thumbnails/v4g/manifest.json'); if(m.entries.length!==12||m.source!=='canonical-showroom-renderer') process.exit(1)"

      - name: Commit refreshed captures
        run: |
          git config user.name 'seraya-thumbnail-bot'
          git config user.email 'seraya-thumbnail-bot@users.noreply.github.com'
          git add \
            public/invitation-thumbnails/v4g \
            scripts/capture-canonical-thumbnails.mjs \
            src/components/marketing/canonical-invitation-thumbnail.tsx \
            src/components/marketing/canonical-thumbnail-capture-status.ts \
            tests/unit/canonical-preview-thumbnail-pipeline.test.ts
          if git diff --cached --quiet; then
            echo 'Canonical thumbnails are already current.'
            exit 0
          fi
          git commit -m 'chore: refresh canonical invitation thumbnails [skip thumbnail capture]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/seraya-thumbnail-server.log || true
