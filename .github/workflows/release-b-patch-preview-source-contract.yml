name: Release B patch preview source contract

on:
  pull_request:
    branches:
      - agent/release-a-flagship-experience

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/release-b-create-to-publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-b-create-to-publish
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Align exact preview source contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/server/invitation-editor-ui.test.tsx')
          source = path.read_text()
          old = "expect(previewSource).toContain('surface=\"preview\"');"
          new = "expect(previewSource).toContain(\"surface={previewSurface === 'personal' ? 'personal' : 'generic'}\");"
          count = source.count(old)
          if count == 0 and new in source:
              raise SystemExit(0)
          if count != 1:
              raise SystemExit(f'Expected one match, found {count}')
          path.write_text(source.replace(old, new))
          PY

      - name: Commit source contract
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'seraya-release-b-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/server/invitation-editor-ui.test.tsx
          git commit -m 'Align Release B exact preview source contract'
          git push origin HEAD:agent/release-b-create-to-publish
