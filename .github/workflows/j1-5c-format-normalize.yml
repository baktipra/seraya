name: J1.5C formatter normalization

on:
  push:
    branches:
      - agent/j1-5c-guestbook-v2-release-confidence

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/j1-5c-guestbook-v2-release-confidence

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize J1.5C files
        run: |
          npx prettier --write \
            .github/workflows/personal-response-e2e.yml \
            src/components/personal-invitation/personal-guestbook.tsx \
            tests/e2e/personal-response.spec.ts \
            tests/e2e/fixture-app/lib/fixture-state.ts \
            'tests/e2e/fixture-app/app/[slug]/g/[guestToken]/page.tsx' \
            'tests/e2e/fixture-app/app/[slug]/g/[guestToken]/guestbook/route.ts'

      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/personal-response-e2e.yml \
            src/components/personal-invitation/personal-guestbook.tsx \
            tests/e2e/personal-response.spec.ts \
            tests/e2e/fixture-app/lib/fixture-state.ts \
            'tests/e2e/fixture-app/app/[slug]/g/[guestToken]/page.tsx' \
            'tests/e2e/fixture-app/app/[slug]/g/[guestToken]/guestbook/route.ts'
          git commit -m "chore: normalize J1.5C formatting"
          git push origin HEAD:agent/j1-5c-guestbook-v2-release-confidence
