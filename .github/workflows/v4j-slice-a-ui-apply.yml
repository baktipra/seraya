name: V4J temporary Slice A UI implementation

on:
  push:
    branches:
      - feature/v4j-invitation-atmosphere-couple-identity-v1
    paths:
      - '.github/workflows/v4j-slice-a-ui-apply.yml'

permissions:
  contents: write

jobs:
  implement-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/v4j-invitation-atmosphere-couple-identity-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply owner UI and template composition
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, content):
              file = Path(path)
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(content)

          def replace(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'Anchor missing in {path}: {old[:180]!r}')
              write(path, text.replace(old, new, 1))

          editor = 'src/components/projects/invitation-editor.tsx'
          replace(
              editor,
              """              <div className="sm:col-span-2">
                        <EditorTextField
                          error={getError(fieldErrors, 'hero.subtitle')}
                          label="Kalimat pendamping"
                          name="hero.subtitle"
                          onValueChange={(value) =>
                            updateLocalContent({ field: 'subtitle', type: 'hero', value })
                          }
                          value={content.hero.subtitle}
                        />
                      </div>
                    </div>
                  </EditorSection>
          """,
              """              <div className="sm:col-span-2">
                        <EditorTextField
                          error={getError(fieldErrors, 'hero.subtitle')}
                          label="Kalimat pendamping"
                          name="hero.subtitle"
                          onValueChange={(value) =>
                            updateLocalContent({ field: 'subtitle', type: 'hero', value })
                          }
                          value={content.hero.subtitle}
                        />
                      </div>
                    </div>

                    <div className="border-seraya-border-default mt-7 space-y-5 border-t pt-6">
                      <div>
                        <h3 className="text-seraya-text-primary text-base font-semibold">
                          Suasana pembuka
                        </h3>
                        <p className="text-seraya-text-muted mt-1 text-sm leading-6">
                          Atur pesan dan ritme pembuka tanpa mengubah identitas visual template.
                        </p>
                      </div>
                      <label className="grid gap-2 text-sm font-semibold">
                        Treatment pembuka
                        <select
                          className="border-seraya-border-default bg-seraya-surface focus-visible:outline-seraya-focus-ring min-h-11 rounded-[var(--seraya-radius-md)] border px-3.5"
                          name="opening.treatment"
                          onChange={(event) =>
                            updateLocalContent({
                              field: 'treatment',
                              type: 'opening-atmosphere',
                              value: event.currentTarget.value,
                            })
                          }
                          value={content.opening.treatment}
                        >
                          <option value="soft">Lembut</option>
                          <option value="editorial">Editorial</option>
                          <option value="ceremonial">Seremonial</option>
                        </select>
                        <FieldError
                          message={getError(fieldErrors, 'opening.treatment')}
                          name="opening.treatment"
                        />
                      </label>
                      <EditorTextAreaField
                        error={getError(fieldErrors, 'opening.message')}
                        help="Muncul setelah sampul dan sebelum tamu memasuki isi undangan."
                        label="Pesan pembuka (opsional)"
                        name="opening.message"
                        onValueChange={(value) =>
                          updateLocalContent({
                            field: 'message',
                            type: 'opening-atmosphere',
                            value,
                          })
                        }
                        value={content.opening.message}
                      />
                      <EditorTextAreaField
                        error={getError(fieldErrors, 'opening.quote')}
                        help="Gunakan satu kutipan singkat. Jangan menempelkan HTML atau lirik panjang."
                        label="Kutipan pembuka (opsional)"
                        name="opening.quote"
                        onValueChange={(value) =>
                          updateLocalContent({
                            field: 'quote',
                            type: 'opening-atmosphere',
                            value,
                          })
                        }
                        value={content.opening.quote}
                      />
                    </div>
                  </EditorSection>
          """,
          )
          replace(
              editor,
              """              </fieldset>
                    </div>
                  </EditorSection>
                </InvitationWorkspacePanel>
              );
            case 'story':
          """,
              """              </fieldset>
                    </div>

                    <div className="border-seraya-border-default mt-7 space-y-5 border-t pt-6">
                      <div>
                        <h3 className="text-seraya-text-primary text-base font-semibold">
                          Identitas pasangan
                        </h3>
                        <p className="text-seraya-text-muted mt-1 text-sm leading-6">
                          Identitas ini bersifat publik dan konsisten pada undangan generik maupun personal.
                        </p>
                      </div>
                      <EditorToggle
                        checked={content.coupleIdentity.monogram.enabled}
                        error={getError(fieldErrors, 'coupleIdentity.monogram.enabled')}
                        help="Bila teks dikosongkan, Seraya menurunkan monogram dari nama pasangan."
                        label="Tampilkan monogram pasangan"
                        name="coupleIdentity.monogram.enabled"
                        onToggle={(value) =>
                          updateLocalContent({
                            field: 'enabled',
                            type: 'couple-monogram',
                            value,
                          })
                        }
                      />
                      <div
                        className="grid gap-5 sm:grid-cols-2"
                        hidden={!content.coupleIdentity.monogram.enabled}
                      >
                        <label className="grid gap-2 text-sm font-semibold">
                          Gaya monogram
                          <select
                            className="border-seraya-border-default bg-seraya-surface focus-visible:outline-seraya-focus-ring min-h-11 rounded-[var(--seraya-radius-md)] border px-3.5"
                            name="coupleIdentity.monogram.style"
                            onChange={(event) =>
                              updateLocalContent({
                                field: 'style',
                                type: 'couple-monogram',
                                value: event.currentTarget.value,
                              })
                            }
                            value={content.coupleIdentity.monogram.style}
                          >
                            <option value="initials">Inisial dengan ampersand</option>
                            <option value="joined_initials">Inisial menyatu</option>
                            <option value="wordmark">Wordmark</option>
                          </select>
                          <FieldError
                            message={getError(fieldErrors, 'coupleIdentity.monogram.style')}
                            name="coupleIdentity.monogram.style"
                          />
                        </label>
                        <EditorTextField
                          error={getError(fieldErrors, 'coupleIdentity.monogram.text')}
                          help="Kosongkan untuk memakai hasil otomatis dari nama pasangan."
                          label="Teks monogram (opsional)"
                          name="coupleIdentity.monogram.text"
                          onValueChange={(value) =>
                            updateLocalContent({
                              field: 'text',
                              type: 'couple-monogram',
                              value,
                            })
                          }
                          value={content.coupleIdentity.monogram.text}
                        />
                      </div>
                      <div className="grid gap-5 sm:grid-cols-2">
                        <EditorTextField
                          error={getError(fieldErrors, 'coupleIdentity.shortName')}
                          label="Nama singkat pasangan (opsional)"
                          name="coupleIdentity.shortName"
                          onValueChange={(value) =>
                            updateLocalContent({
                              field: 'shortName',
                              type: 'couple-identity',
                              value,
                            })
                          }
                          placeholder="Raka dan Nadia"
                          value={content.coupleIdentity.shortName}
                        />
                        <EditorTextField
                          error={getError(fieldErrors, 'coupleIdentity.weddingHashtag')}
                          help="Contoh: #RakaNadia2027"
                          label="Wedding hashtag (opsional)"
                          name="coupleIdentity.weddingHashtag"
                          onValueChange={(value) =>
                            updateLocalContent({
                              field: 'weddingHashtag',
                              type: 'couple-identity',
                              value,
                            })
                          }
                          value={content.coupleIdentity.weddingHashtag}
                        />
                        <EditorTextField
                          error={getError(
                            fieldErrors,
                            'coupleIdentity.socialLinks.instagram',
                          )}
                          label="Profil Instagram (opsional)"
                          name="coupleIdentity.socialLinks.instagram"
                          onValueChange={(value) =>
                            updateLocalContent({
                              field: 'instagram',
                              type: 'couple-social',
                              value,
                            })
                          }
                          placeholder="https://www.instagram.com/..."
                          type="url"
                          value={content.coupleIdentity.socialLinks.instagram}
                        />
                        <EditorTextField
                          error={getError(fieldErrors, 'coupleIdentity.socialLinks.tiktok')}
                          label="Profil TikTok (opsional)"
                          name="coupleIdentity.socialLinks.tiktok"
                          onValueChange={(value) =>
                            updateLocalContent({
                              field: 'tiktok',
                              type: 'couple-social',
                              value,
                            })
                          }
                          placeholder="https://www.tiktok.com/@..."
                          type="url"
                          value={content.coupleIdentity.socialLinks.tiktok}
                        />
                        <div className="sm:col-span-2">
                          <EditorTextField
                            error={getError(
                              fieldErrors,
                              'coupleIdentity.socialLinks.website',
                            )}
                            label="Website pasangan (opsional)"
                            name="coupleIdentity.socialLinks.website"
                            onValueChange={(value) =>
                              updateLocalContent({
                                field: 'website',
                                type: 'couple-social',
                                value,
                              })
                            }
                            placeholder="https://..."
                            type="url"
                            value={content.coupleIdentity.socialLinks.website}
                          />
                        </div>
                      </div>
                    </div>
                  </EditorSection>
                </InvitationWorkspacePanel>
              );
            case 'story':
          """,
          )

          workspace = 'src/components/projects/invitation-editor-workspace.tsx'
          replace(
              workspace,
              "  { matches: (fieldName) => fieldName.startsWith('hero.'), section: 'opening' },\n",
              """  {
            matches: (fieldName) =>
              fieldName.startsWith('hero.') || fieldName.startsWith('opening.'),
            section: 'opening',
          },
          """,
          )
          replace(
              workspace,
              "  { matches: (fieldName) => fieldName.startsWith('couple.'), section: 'couple' },\n",
              """  {
            matches: (fieldName) =>
              fieldName.startsWith('couple.') || fieldName.startsWith('coupleIdentity.'),
            section: 'couple',
          },
          """,
          )

          roselle = 'src/modules/invitation-templates/roselle/roselle-template.tsx'
          replace(
              roselle,
              "import {\n  getPersonalInvitationPresentationSlots,\n",
              """import {
            InvitationIdentityFooter,
            InvitationOpeningIdentity,
          } from '../invitation-atmosphere-identity';
          import {
            getPersonalInvitationPresentationSlots,
          """,
          )
          replace(
              roselle,
              '      <RoselleHero hero={invitation.hero} />\n',
              """      <RoselleHero hero={invitation.hero} />
            <InvitationOpeningIdentity invitation={invitation} template="roselle" />
          """,
          )
          replace(
              roselle,
              '        <RoselleClosing closing={invitation.closing} />\n',
              """        <InvitationIdentityFooter invitation={invitation} template="roselle" />
                <RoselleClosing closing={invitation.closing} />
          """,
          )

          aruna = 'src/modules/invitation-templates/aruna/aruna-template.tsx'
          replace(
              aruna,
              "import { DigitalGiftCopyButton } from '../digital-gift-copy-button';\n",
              """import { DigitalGiftCopyButton } from '../digital-gift-copy-button';
          import {
            InvitationIdentityFooter,
            InvitationOpeningIdentity,
          } from '../invitation-atmosphere-identity';
          """,
          )
          replace(
              aruna,
              '      </header>\n\n      <a data-aruna-opening-action',
              """      </header>

            <InvitationOpeningIdentity invitation={invitation} template="aruna" />

            <a data-aruna-opening-action""",
          )
          replace(
              aruna,
              '        {invitation.closing ? (\n',
              """        <InvitationIdentityFooter invitation={invitation} template="aruna" />

                {invitation.closing ? (
          """,
          )

          laras = 'src/modules/invitation-templates/laras/laras-template.tsx'
          replace(
              laras,
              "import { DigitalGiftCopyButton } from '../digital-gift-copy-button';\n",
              """import { DigitalGiftCopyButton } from '../digital-gift-copy-button';
          import {
            InvitationIdentityFooter,
            InvitationOpeningIdentity,
          } from '../invitation-atmosphere-identity';
          """,
          )
          replace(
              laras,
              """  const monogram = createLarasMonogram(
                invitation.couple.personOne.displayName,
                invitation.couple.personTwo.displayName,
              );
          """,
              """  const monogram =
            invitation.identity?.monogram?.text ??
            createLarasMonogram(
              invitation.couple.personOne.displayName,
              invitation.couple.personTwo.displayName,
            );
          """,
          )
          replace(
              laras,
              '      </header>\n\n      <a data-invitation-opening-action',
              """      </header>

            <InvitationOpeningIdentity invitation={invitation} showMonogram={false} template="laras" />

            <a data-invitation-opening-action""",
          )
          replace(
              laras,
              '        {invitation.closing ? (\n',
              """        <InvitationIdentityFooter invitation={invitation} template="laras" />

                {invitation.closing ? (
          """,
          )

          test_path = Path('tests/unit/invitation-atmosphere-identity-v4j.test.tsx')
          test = test_path.read_text()
          test = test.replace(
              "import { renderToStaticMarkup } from 'react-dom/server';\n",
              """import { readFileSync } from 'node:fs';

          import { renderToStaticMarkup } from 'react-dom/server';
          """,
              1,
          )
          marker = """  it('derives public-safe identity and presentation', () => {
          """
          addition = """  it('mounts the identity experience in the owner editor and all templates', () => {
            const editorSource = readFileSync(
              'src/components/projects/invitation-editor.tsx',
              'utf8',
            );
            expect(editorSource).toContain('name="opening.treatment"');
            expect(editorSource).toContain('name="coupleIdentity.monogram.enabled"');

            for (const template of ['roselle', 'aruna', 'laras']) {
              const source = readFileSync(
                `src/modules/invitation-templates/${template}/${template}-template.tsx`,
                'utf8',
              );
              expect(source).toContain('InvitationOpeningIdentity');
              expect(source).toContain('InvitationIdentityFooter');
            }
          });

          """
          if marker not in test:
              raise SystemExit('Focused test insertion marker missing.')
          test_path.write_text(test.replace(marker, addition + marker, 1))

          write(
              '.github/workflows/v4j-invitation-atmosphere-identity.yml',
              """name: V4J invitation atmosphere and identity validation

          on:
            pull_request:
              paths:
                - 'src/components/projects/invitation-editor.tsx'
                - 'src/components/projects/invitation-editor-workspace.tsx'
                - 'src/modules/invitations/**'
                - 'src/modules/invitation-templates/**'
                - 'src/modules/publications/__tests__/publication.service.test.ts'
                - 'tests/unit/invitation-atmosphere-identity-v4j.test.tsx'
                - '.github/workflows/v4j-invitation-atmosphere-identity.yml'
            push:
              branches:
                - feature/v4j-invitation-atmosphere-couple-identity-v1
              paths:
                - 'src/components/projects/invitation-editor.tsx'
                - 'src/components/projects/invitation-editor-workspace.tsx'
                - 'src/modules/invitations/**'
                - 'src/modules/invitation-templates/**'
                - 'src/modules/publications/__tests__/publication.service.test.ts'
                - 'tests/unit/invitation-atmosphere-identity-v4j.test.tsx'
                - '.github/workflows/v4j-invitation-atmosphere-identity.yml'

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4
                - name: Set up Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - name: Install dependencies
                  run: npm ci
                - name: Check V4J Slice A formatting
                  run: |
                    npx prettier --check \
                      src/components/projects/invitation-editor.tsx \
                      src/components/projects/invitation-editor-workspace.tsx \
                      src/modules/invitations/invitation-draft.schema.ts \
                      src/modules/invitations/invitation-draft.defaults.ts \
                      src/modules/invitations/invitation-editor-local-state.ts \
                      src/modules/invitations/invitation-editor.schema.ts \
                      src/modules/invitations/invitation-editor.service.ts \
                      src/modules/invitation-templates/invitation-view-model.ts \
                      src/modules/invitation-templates/invitation-atmosphere-identity.tsx \
                      src/modules/invitation-templates/invitation-atmosphere-identity.module.css \
                      src/modules/invitation-templates/roselle/roselle-template.tsx \
                      src/modules/invitation-templates/aruna/aruna-template.tsx \
                      src/modules/invitation-templates/laras/laras-template.tsx \
                      src/modules/publications/__tests__/publication.service.test.ts \
                      tests/unit/invitation-atmosphere-identity-v4j.test.tsx
                - name: Lint V4J Slice A
                  run: |
                    npx eslint \
                      src/components/projects/invitation-editor.tsx \
                      src/components/projects/invitation-editor-workspace.tsx \
                      src/modules/invitations/invitation-draft.schema.ts \
                      src/modules/invitations/invitation-draft.defaults.ts \
                      src/modules/invitations/invitation-editor-local-state.ts \
                      src/modules/invitations/invitation-editor.schema.ts \
                      src/modules/invitations/invitation-editor.service.ts \
                      src/modules/invitation-templates/invitation-view-model.ts \
                      src/modules/invitation-templates/invitation-atmosphere-identity.tsx \
                      src/modules/invitation-templates/roselle/roselle-template.tsx \
                      src/modules/invitation-templates/aruna/aruna-template.tsx \
                      src/modules/invitation-templates/laras/laras-template.tsx \
                      src/modules/publications/__tests__/publication.service.test.ts \
                      tests/unit/invitation-atmosphere-identity-v4j.test.tsx
                - name: Typecheck
                  run: npm run typecheck
                - name: Focused V4J Slice A tests
                  run: npx vitest run tests/unit/invitation-atmosphere-identity-v4j.test.tsx
                - name: Production build
                  run: npm run build
          """,
          )
          PY

      - name: Format Slice A UI
        run: |
          npx prettier --write \
            src/components/projects/invitation-editor.tsx \
            src/components/projects/invitation-editor-workspace.tsx \
            src/modules/invitation-templates/roselle/roselle-template.tsx \
            src/modules/invitation-templates/aruna/aruna-template.tsx \
            src/modules/invitation-templates/laras/laras-template.tsx \
            tests/unit/invitation-atmosphere-identity-v4j.test.tsx \
            .github/workflows/v4j-invitation-atmosphere-identity.yml

      - name: Validate Slice A UI
        run: |
          npx eslint \
            src/components/projects/invitation-editor.tsx \
            src/components/projects/invitation-editor-workspace.tsx \
            src/modules/invitation-templates/roselle/roselle-template.tsx \
            src/modules/invitation-templates/aruna/aruna-template.tsx \
            src/modules/invitation-templates/laras/laras-template.tsx \
            tests/unit/invitation-atmosphere-identity-v4j.test.tsx
          npm run typecheck
          npx vitest run tests/unit/invitation-atmosphere-identity-v4j.test.tsx
          npm run build

      - name: Commit Slice A UI
        run: |
          rm .github/workflows/v4j-slice-a-ui-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/v4j-invitation-atmosphere-identity.yml .github/workflows/v4j-slice-a-ui-apply.yml
          git commit -m "SERAYA V4J: complete couple identity and opening Slice A"
          git push origin HEAD:feature/v4j-invitation-atmosphere-couple-identity-v1
