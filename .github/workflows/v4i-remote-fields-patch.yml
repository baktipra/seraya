name: V4I temporary remote attendance field patch

on:
  push:
    branches:
      - feature/v4i-remote-attendance-public-social-share-v1
    paths:
      - '.github/workflows/v4i-remote-fields-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/v4i-remote-attendance-public-social-share-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply V4I compatibility fields
        run: |
          python <<'PY'
          from pathlib import Path

          def edit(path, transform):
              file = Path(path)
              text = file.read_text()
              updated = transform(text)
              if updated == text:
                  raise SystemExit(f'No change produced for {path}')
              file.write_text(updated)

          def before(text, marker, addition):
              if addition.strip() in text:
                  return text
              if marker not in text:
                  raise SystemExit(f'Missing marker: {marker!r}')
              return text.replace(marker, addition + marker, 1)

          def after(text, marker, addition):
              if addition.strip() in text:
                  return text
              if marker not in text:
                  raise SystemExit(f'Missing marker: {marker!r}')
              return text.replace(marker, marker + addition, 1)

          edit(
              'src/modules/invitations/invitation-draft.schema.ts',
              lambda text: after(
                  before(
                      text,
                      "    livestreamEnabled: z.boolean().optional(),\n",
                      "    livestreamDescription: nullableText(600, 'Deskripsi siaran').optional(),\n",
                  ),
                  "    livestreamHeading: nullableText(160, 'Judul siaran langsung').optional(),\n",
                  "    livestreamPostEventMode: z.enum(['hide', 'recording']).optional(),\n"
                  "    livestreamPreEventMessage: nullableText(600, 'Pesan sebelum siaran').optional(),\n",
              ),
          )

          edit(
              'src/modules/invitations/invitation-draft.defaults.ts',
              lambda text: after(
                  before(
                      text,
                      "          livestreamEnabled: false,\n",
                      "          livestreamDescription: null,\n",
                  ),
                  "          livestreamHeading: null,\n",
                  "          livestreamPostEventMode: 'recording',\n"
                  "          livestreamPreEventMessage: null,\n",
              ),
          )

          edit(
              'src/modules/invitations/invitation-editor.schema.ts',
              lambda text: after(
                  after(
                      before(
                          before(
                              text,
                              "  'livestreamEnabled',\n",
                              "  'livestreamDescription',\n",
                          ),
                          "                    livestreamEnabled: checkboxInputSchema.optional(),\n",
                          "                    livestreamDescription: formTextSchema.optional(),\n",
                      ),
                      "  'livestreamHeading',\n",
                      "  'livestreamPostEventMode',\n  'livestreamPreEventMessage',\n",
                  ),
                  "                    livestreamHeading: formTextSchema.optional(),\n",
                  "                    livestreamPostEventMode: formTextSchema.optional(),\n"
                  "                    livestreamPreEventMessage: formTextSchema.optional(),\n",
              ),
          )

          edit(
              'src/modules/invitations/invitation-editor-local-state.ts',
              lambda text: after(
                  after(
                      before(
                          text,
                          "        livestreamEnabled: event.livestreamEnabled === true,\n",
                          "        livestreamDescription: event.livestreamDescription ?? '',\n",
                      ),
                      "        livestreamHeading: event.livestreamHeading ?? '',\n",
                      "        livestreamPostEventMode: event.livestreamPostEventMode ?? 'recording',\n"
                      "        livestreamPreEventMessage: event.livestreamPreEventMessage ?? '',\n",
                  ),
                  "        livestreamUrl: event.livestreamUrl ?? '',\n",
                  "",
              ),
          )

          edit(
              'src/modules/invitations/invitation-editor.service.ts',
              lambda text: after(
                  after(
                      before(
                          text,
                          "      livestreamEnabled: event.livestreamEnabled === true,\n",
                          "      livestreamDescription: normalizeOptionalText(event.livestreamDescription),\n",
                      ),
                      "      livestreamHeading: normalizeOptionalText(event.livestreamHeading),\n",
                      "      livestreamPostEventMode:\n"
                      "        event.livestreamPostEventMode === 'hide' ? 'hide' : 'recording',\n"
                      "      livestreamPreEventMessage: normalizeOptionalText(event.livestreamPreEventMessage),\n",
                  ),
                  "      livestreamUrl: normalizeOptionalText(event.livestreamUrl),\n",
                  "",
              ),
          )

          def patch_view_model(text):
              text = before(
                  text,
                  "  livestreamEnabled?: boolean;\n",
                  "  livestreamDescription?: string | null;\n",
              )
              text = after(
                  text,
                  "  livestreamHeading?: string | null;\n",
                  "  livestreamPostEventMode?: 'hide' | 'recording';\n"
                  "  livestreamPreEventMessage?: string | null;\n",
              )
              text = before(
                  text,
                  "    livestreamEnabled: event.livestreamEnabled === true,\n",
                  "    livestreamDescription: event.livestreamDescription ?? null,\n",
              )
              text = after(
                  text,
                  "    livestreamHeading: event.livestreamHeading ?? null,\n",
                  "    livestreamPostEventMode: event.livestreamPostEventMode ?? 'recording',\n"
                  "    livestreamPreEventMessage: event.livestreamPreEventMessage ?? null,\n",
              )
              text = before(
                  text,
                  "    livestreamEnabled: false,\n",
                  "    livestreamDescription: null,\n",
              )
              return after(
                  text,
                  "    livestreamHeading: null,\n",
                  "    livestreamPostEventMode: 'recording',\n"
                  "    livestreamPreEventMessage: null,\n",
              )

          edit('src/modules/invitation-templates/invitation-view-model.ts', patch_view_model)

          def patch_editor_component(text):
              if 'livestreamPreEventMessage: change.currentTarget.value' in text:
                  return text
              start = text.find("placeholder={`Siaran langsung ${event.title || 'acara'}`}")
              if start < 0:
                  raise SystemExit('Livestream heading anchor missing')
              end_marker = '            </label>'
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit('Livestream heading label end missing')
              end += len(end_marker)
              addition = """
              <label className="text-seraya-text-primary space-y-2 text-sm font-semibold sm:col-span-2">
                Pesan sebelum acara (opsional)
                <textarea
                  className="bg-seraya-surface border-seraya-border-default min-h-24 w-full rounded-[var(--seraya-radius-md)] border px-3.5 py-3 font-normal leading-6"
                  onChange={(change) =>
                    onChange({
                      ...event,
                      livestreamPreEventMessage: change.currentTarget.value,
                    })
                  }
                  placeholder="Siaran akan dibuka menjelang acara dimulai."
                  value={event.livestreamPreEventMessage ?? ''}
                />
              </label>
              <label className="text-seraya-text-primary space-y-2 text-sm font-semibold sm:col-span-2">
                Deskripsi siaran (opsional)
                <textarea
                  className="bg-seraya-surface border-seraya-border-default min-h-24 w-full rounded-[var(--seraya-radius-md)] border px-3.5 py-3 font-normal leading-6"
                  onChange={(change) =>
                    onChange({
                      ...event,
                      livestreamDescription: change.currentTarget.value,
                    })
                  }
                  placeholder="Saksikan momen kami dari mana pun Anda berada."
                  value={event.livestreamDescription ?? ''}
                />
              </label>
              <label className="text-seraya-text-primary space-y-2 text-sm font-semibold sm:col-span-2">
                Setelah acara selesai
                <select
                  className="bg-seraya-surface border-seraya-border-default min-h-11 w-full rounded-[var(--seraya-radius-md)] border px-3.5 font-normal"
                  onChange={(change) =>
                    onChange({
                      ...event,
                      livestreamPostEventMode:
                        change.currentTarget.value === 'hide' ? 'hide' : 'recording',
                    })
                  }
                  value={event.livestreamPostEventMode ?? 'recording'}
                >
                  <option value="recording">Tampilkan sebagai rekaman</option>
                  <option value="hide">Sembunyikan bagian siaran</option>
                </select>
              </label>"""
              return text[:end] + addition + text[end:]

          edit('src/components/projects/event-utility-editor-fields.tsx', patch_editor_component)
          PY

      - name: Format V4I files
        run: |
          npx prettier --write \
            src/modules/invitations/invitation-draft.schema.ts \
            src/modules/invitations/invitation-draft.defaults.ts \
            src/modules/invitations/invitation-editor.schema.ts \
            src/modules/invitations/invitation-editor-local-state.ts \
            src/modules/invitations/invitation-editor.service.ts \
            src/modules/invitation-templates/invitation-view-model.ts \
            src/components/projects/event-utility-editor-fields.tsx \
            src/modules/invitation-templates/guest-event-utility-core.ts \
            src/modules/invitation-templates/guest-event-utility.tsx \
            src/modules/public-social-share/public-social-share.core.ts \
            src/modules/public-social-share/public-social-share.service.ts \
            src/components/projects/public-social-share-kit.tsx \
            'src/app/(dashboard)/dashboard/[projectId]/delivery/page.tsx' \
            'src/app/api/projects/[projectId]/public-share/qr/route.ts' \
            'src/app/api/projects/[projectId]/public-share/story/route.tsx' \
            tests/unit/public-social-share-v4i.test.ts \
            tests/unit/remote-attendance-v4i.test.ts \
            .github/workflows/v4i-public-social-share.yml

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/v4i-public-social-share.yml
          git commit -m "SERAYA V4I: complete remote attendance editor contract"
          git push origin HEAD:feature/v4i-remote-attendance-public-social-share-v1
