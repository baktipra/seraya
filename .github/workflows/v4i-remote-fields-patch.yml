name: V4I temporary remote attendance field patch

on:
  push:
    branches:
      - feature/v4i-remote-attendance-public-social-share-v1
    paths:
      - '.github/workflows/v4i-remote-fields-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/v4i-remote-attendance-public-social-share-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply V4I compatibility fields
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Anchor missing in {path}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          replace(
              'src/modules/invitations/invitation-draft.schema.ts',
              """    livestreamEnabled: z.boolean().optional(),
              livestreamHeading: nullableText(160, 'Judul siaran langsung').optional(),
              livestreamUrl: nullableLivestreamUrl.optional(),
          """,
              """    livestreamDescription: nullableText(600, 'Deskripsi siaran').optional(),
              livestreamEnabled: z.boolean().optional(),
              livestreamHeading: nullableText(160, 'Judul siaran langsung').optional(),
              livestreamPostEventMode: z.enum(['hide', 'recording']).optional(),
              livestreamPreEventMessage: nullableText(600, 'Pesan sebelum siaran').optional(),
              livestreamUrl: nullableLivestreamUrl.optional(),
          """,
          )

          replace(
              'src/modules/invitations/invitation-draft.defaults.ts',
              """          latitude: null,
              livestreamEnabled: false,
              livestreamHeading: null,
              livestreamUrl: null,
          """,
              """          latitude: null,
              livestreamDescription: null,
              livestreamEnabled: false,
              livestreamHeading: null,
              livestreamPostEventMode: 'recording',
              livestreamPreEventMessage: null,
              livestreamUrl: null,
          """,
          )

          replace(
              'src/modules/invitations/invitation-editor.schema.ts',
              """  'livestreamEnabled',
            'livestreamUrl',
            'livestreamHeading',
          """,
              """  'livestreamDescription',
            'livestreamEnabled',
            'livestreamUrl',
            'livestreamHeading',
            'livestreamPostEventMode',
            'livestreamPreEventMessage',
          """,
          )

          replace(
              'src/modules/invitations/invitation-editor.schema.ts',
              """                    latitude: formTextSchema.optional(),
                        livestreamEnabled: checkboxInputSchema.optional(),
                        livestreamHeading: formTextSchema.optional(),
                        livestreamUrl: formTextSchema.optional(),
          """,
              """                    latitude: formTextSchema.optional(),
                        livestreamDescription: formTextSchema.optional(),
                        livestreamEnabled: checkboxInputSchema.optional(),
                        livestreamHeading: formTextSchema.optional(),
                        livestreamPostEventMode: formTextSchema.optional(),
                        livestreamPreEventMessage: formTextSchema.optional(),
                        livestreamUrl: formTextSchema.optional(),
          """,
          )

          replace(
              'src/modules/invitations/invitation-editor-local-state.ts',
              """        latitude: event.latitude?.toString() ?? '',
                livestreamEnabled: event.livestreamEnabled === true,
                livestreamHeading: event.livestreamHeading ?? '',
                livestreamUrl: event.livestreamUrl ?? '',
          """,
              """        latitude: event.latitude?.toString() ?? '',
                livestreamDescription: event.livestreamDescription ?? '',
                livestreamEnabled: event.livestreamEnabled === true,
                livestreamHeading: event.livestreamHeading ?? '',
                livestreamPostEventMode: event.livestreamPostEventMode ?? 'recording',
                livestreamPreEventMessage: event.livestreamPreEventMessage ?? '',
                livestreamUrl: event.livestreamUrl ?? '',
          """,
          )

          replace(
              'src/modules/invitations/invitation-editor.service.ts',
              """      latitude: normalizeOptionalCoordinate(event.latitude),
                  livestreamEnabled: event.livestreamEnabled === true,
                  livestreamHeading: normalizeOptionalText(event.livestreamHeading),
                  livestreamUrl: normalizeOptionalText(event.livestreamUrl),
          """,
              """      latitude: normalizeOptionalCoordinate(event.latitude),
                  livestreamDescription: normalizeOptionalText(event.livestreamDescription),
                  livestreamEnabled: event.livestreamEnabled === true,
                  livestreamHeading: normalizeOptionalText(event.livestreamHeading),
                  livestreamPostEventMode:
                    event.livestreamPostEventMode === 'hide' ? 'hide' : 'recording',
                  livestreamPreEventMessage: normalizeOptionalText(event.livestreamPreEventMessage),
                  livestreamUrl: normalizeOptionalText(event.livestreamUrl),
          """,
          )

          replace(
              'src/modules/invitation-templates/invitation-view-model.ts',
              """  latitude?: number | null;
            livestreamEnabled?: boolean;
            livestreamHeading?: string | null;
            livestreamUrl?: string | null;
          """,
              """  latitude?: number | null;
            livestreamDescription?: string | null;
            livestreamEnabled?: boolean;
            livestreamHeading?: string | null;
            livestreamPostEventMode?: 'hide' | 'recording';
            livestreamPreEventMessage?: string | null;
            livestreamUrl?: string | null;
          """,
          )

          replace(
              'src/modules/invitation-templates/invitation-view-model.ts',
              """    latitude: event.latitude ?? null,
                livestreamEnabled: event.livestreamEnabled === true,
                livestreamHeading: event.livestreamHeading ?? null,
                livestreamUrl: getSafeHttpsHref(event.livestreamUrl),
          """,
              """    latitude: event.latitude ?? null,
                livestreamDescription: event.livestreamDescription ?? null,
                livestreamEnabled: event.livestreamEnabled === true,
                livestreamHeading: event.livestreamHeading ?? null,
                livestreamPostEventMode: event.livestreamPostEventMode ?? 'recording',
                livestreamPreEventMessage: event.livestreamPreEventMessage ?? null,
                livestreamUrl: getSafeHttpsHref(event.livestreamUrl),
          """,
          )

          replace(
              'src/modules/invitation-templates/invitation-view-model.ts',
              """    latitude: null,
                livestreamEnabled: false,
                livestreamHeading: null,
                livestreamUrl: null,
          """,
              """    latitude: null,
                livestreamDescription: null,
                livestreamEnabled: false,
                livestreamHeading: null,
                livestreamPostEventMode: 'recording',
                livestreamPreEventMessage: null,
                livestreamUrl: null,
          """,
          )

          replace(
              'src/components/projects/event-utility-editor-fields.tsx',
              """            <label className=\"text-seraya-text-primary space-y-2 text-sm font-semibold sm:col-span-2\">
                          Judul siaran (opsional)
                          <input
                            className=\"bg-seraya-surface border-seraya-border-default min-h-11 w-full rounded-[var(--seraya-radius-md)] border px-3.5 font-normal\"
                            onChange={(change) =>
                              onChange({ ...event, livestreamHeading: change.currentTarget.value })
                            }
                            placeholder={`Siaran langsung ${event.title || 'acara'}`}
                            value={event.livestreamHeading ?? ''}
                          />
                        </label>
          """,
              """            <label className=\"text-seraya-text-primary space-y-2 text-sm font-semibold sm:col-span-2\">
                          Judul siaran (opsional)
                          <input
                            className=\"bg-seraya-surface border-seraya-border-default min-h-11 w-full rounded-[var(--seraya-radius-md)] border px-3.5 font-normal\"
                            onChange={(change) =>
                              onChange({ ...event, livestreamHeading: change.currentTarget.value })
                            }
                            placeholder={`Siaran ${event.title || 'acara'}`}
                            value={event.livestreamHeading ?? ''}
                          />
                        </label>
                        <label className=\"text-seraya-text-primary space-y-2 text-sm font-semibold sm:col-span-2\">
                          Pesan sebelum acara (opsional)
                          <textarea
                            className=\"bg-seraya-surface border-seraya-border-default min-h-24 w-full rounded-[var(--seraya-radius-md)] border px-3.5 py-3 font-normal leading-6\"
                            onChange={(change) =>
                              onChange({
                                ...event,
                                livestreamPreEventMessage: change.currentTarget.value,
                              })
                            }
                            placeholder=\"Siaran akan dibuka menjelang acara dimulai.\"
                            value={event.livestreamPreEventMessage ?? ''}
                          />
                        </label>
                        <label className=\"text-seraya-text-primary space-y-2 text-sm font-semibold sm:col-span-2\">
                          Deskripsi siaran (opsional)
                          <textarea
                            className=\"bg-seraya-surface border-seraya-border-default min-h-24 w-full rounded-[var(--seraya-radius-md)] border px-3.5 py-3 font-normal leading-6\"
                            onChange={(change) =>
                              onChange({
                                ...event,
                                livestreamDescription: change.currentTarget.value,
                              })
                            }
                            placeholder=\"Saksikan momen kami dari mana pun Anda berada.\"
                            value={event.livestreamDescription ?? ''}
                          />
                        </label>
                        <label className=\"text-seraya-text-primary space-y-2 text-sm font-semibold sm:col-span-2\">
                          Setelah acara selesai
                          <select
                            className=\"bg-seraya-surface border-seraya-border-default min-h-11 w-full rounded-[var(--seraya-radius-md)] border px-3.5 font-normal\"
                            onChange={(change) =>
                              onChange({
                                ...event,
                                livestreamPostEventMode:
                                  change.currentTarget.value === 'hide' ? 'hide' : 'recording',
                              })
                            }
                            value={event.livestreamPostEventMode ?? 'recording'}
                          >
                            <option value=\"recording\">Tampilkan sebagai rekaman</option>
                            <option value=\"hide\">Sembunyikan bagian siaran</option>
                          </select>
                        </label>
          """,
          )
          PY

      - name: Format V4I files
        run: |
          npx prettier --write \
            src/modules/invitations/invitation-draft.schema.ts \
            src/modules/invitations/invitation-draft.defaults.ts \
            src/modules/invitations/invitation-editor.schema.ts \
            src/modules/invitations/invitation-editor-local-state.ts \
            src/modules/invitations/invitation-editor.service.ts \
            src/modules/invitation-templates/invitation-view-model.ts \
            src/components/projects/event-utility-editor-fields.tsx \
            src/modules/invitation-templates/guest-event-utility-core.ts \
            src/modules/invitation-templates/guest-event-utility.tsx \
            src/modules/public-social-share/public-social-share.core.ts \
            src/modules/public-social-share/public-social-share.service.ts \
            src/components/projects/public-social-share-kit.tsx \
            'src/app/(dashboard)/dashboard/[projectId]/delivery/page.tsx' \
            'src/app/api/projects/[projectId]/public-share/qr/route.ts' \
            'src/app/api/projects/[projectId]/public-share/story/route.tsx' \
            tests/unit/public-social-share-v4i.test.ts \
            tests/unit/remote-attendance-v4i.test.ts \
            .github/workflows/v4i-public-social-share.yml

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/v4i-public-social-share.yml
          git commit -m "SERAYA V4I: complete remote attendance editor contract"
          git push origin HEAD:feature/v4i-remote-attendance-public-social-share-v1
