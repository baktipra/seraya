name: V4I temporary QR dependency install

on:
  push:
    branches:
      - feature/v4i-remote-attendance-public-social-share-v1
    paths:
      - '.github/workflows/v4i-install-qr.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/v4i-remote-attendance-public-social-share-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install QR dependencies
        run: npm install qrcode && npm install --save-dev @types/qrcode

      - name: Commit dependency manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "SERAYA V4I: add local QR generation dependency"
          git push origin HEAD:feature/v4i-remote-attendance-public-social-share-v1
