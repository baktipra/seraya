name: Apply Invitation Studio Slice D

on:
  push:
    branches:
      - feature/invitation-studio-slice-d-media-mode-asset-authority
    paths:
      - 'tools/apply-invitation-studio-slice-d.py'
      - '.github/workflows/invitation-studio-slice-d-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/invitation-studio-slice-d-media-mode-asset-authority
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repair one-time provider replacement
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply-invitation-studio-slice-d.py')
          content = path.read_text()
          old = '''    if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return content.replace(old, new, 1)'''
          new = '''    if count == 0 or (count != 1 and label != "provider value synchronize"):
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return content.replace(old, new, 1)'''
          if old not in content:
              raise SystemExit('replace helper target missing')
          path.write_text(content.replace(old, new, 1))
          PY
      - name: Apply Slice D refactor
        run: python tools/apply-invitation-studio-slice-d.py
      - name: Remove one-time refactor script
        run: rm tools/apply-invitation-studio-slice-d.py
      - name: Fix reorder repository import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/api/projects/[projectId]/gallery/reorder/route.ts')
          content = path.read_text()
          content = content.replace('  MediaRepositoryError,\n', '')
          content = content.replace(
              "import { galleryMediaOrderSchema } from '@/modules/media/media.validation';\n",
              "import { MediaRepositoryError } from '@/modules/media/media.repository';\nimport { galleryMediaOrderSchema } from '@/modules/media/media.validation';\n",
          )
          path.write_text(content)
          PY
      - name: Format touched source
        run: |
          npx prettier --write \
            'src/app/(dashboard)/dashboard/[projectId]/invitation/page.tsx' \
            'src/app/api/projects/[projectId]/gallery/reorder/route.ts' \
            src/components/projects/gallery-manager.tsx \
            src/components/projects/invitation-audio-manager.tsx \
            src/components/projects/invitation-editor.tsx \
            src/components/projects/invitation-studio-media-mode.tsx \
            src/components/projects/invitation-studio-media-mode.module.css \
            src/components/projects/invitation-studio-provider.tsx \
            src/modules/invitations/invitation-editor-local-state.ts \
            src/modules/invitations/invitation-editor.schema.ts \
            src/modules/invitations/invitation-editor.service.ts \
            src/modules/media/media.service.ts \
            src/modules/media/media.validation.ts
      - name: Lint focused source
        run: |
          npx eslint \
            'src/app/(dashboard)/dashboard/[projectId]/invitation/page.tsx' \
            'src/app/api/projects/[projectId]/gallery/reorder/route.ts' \
            src/components/projects/gallery-manager.tsx \
            src/components/projects/invitation-audio-manager.tsx \
            src/components/projects/invitation-editor.tsx \
            src/components/projects/invitation-studio-media-mode.tsx \
            src/components/projects/invitation-studio-provider.tsx \
            src/modules/invitations/invitation-editor-local-state.ts \
            src/modules/invitations/invitation-editor.schema.ts \
            src/modules/invitations/invitation-editor.service.ts \
            src/modules/media/media.service.ts \
            src/modules/media/media.validation.ts
      - run: npm run typecheck
      - name: Run prior Slice contracts
        run: |
          npx vitest run \
            tests/unit/invitation-studio-structural-foundation-slice-a.test.tsx \
            tests/unit/invitation-studio-unified-state-slice-b.test.ts \
            tests/unit/invitation-studio-design-mode-slice-c.test.ts
      - run: npm run build
      - name: Commit Slice D source implementation
        run: |
          git config user.name "seraya-release-bot"
          git config user.email "88146860+baktipra@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "SERAYA Slice D: activate Media Mode asset authority"
          git push origin HEAD:feature/invitation-studio-slice-d-media-mode-asset-authority
