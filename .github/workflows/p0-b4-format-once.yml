name: P0 B4 format once

on:
  push:
    branches:
      - agent/p0-b4-canonical-invitation-showroom

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-b4-canonical-invitation-showroom

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format B3 and B4 source
        run: |
          npx prettier --write \
            "src/app/templates/[templateKey]/demo/[surface]/page.tsx" \
            src/app/templates/page.tsx \
            src/components/marketing/flagship-marketing.tsx \
            src/modules/invitation-templates/__tests__/canonical-showroom-contract.test.tsx \
            src/modules/invitation-templates/__tests__/invitation-template-quality-bar-contract.test.ts \
            src/modules/invitation-templates/showroom/canonical-showroom-invitation.tsx

      - name: Commit formatted output
        run: |
          if git diff --quiet; then
            echo "No formatting changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "src/app/templates/[templateKey]/demo/[surface]/page.tsx" \
            src/app/templates/page.tsx \
            src/components/marketing/flagship-marketing.tsx \
            src/modules/invitation-templates/__tests__/canonical-showroom-contract.test.tsx \
            src/modules/invitation-templates/__tests__/invitation-template-quality-bar-contract.test.ts \
            src/modules/invitation-templates/showroom/canonical-showroom-invitation.tsx
          git commit -m "P0-B4: format showroom source"
          git push origin HEAD:agent/p0-b4-canonical-invitation-showroom
