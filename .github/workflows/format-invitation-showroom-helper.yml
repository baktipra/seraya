name: Format invitation review showroom

on:
  push:
    branches:
      - agent/release-a-flagship-experience

permissions:
  contents: write

jobs:
  format-showroom:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-a-flagship-experience

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format showroom scope
        run: |
          npx prettier --write \
            .github/workflows/invitation-experience-e2e.yml \
            src/app/release-a-invitation-preview/page.tsx \
            tests/e2e/release-a-invitation-showroom.spec.ts

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo 'Invitation showroom files are already formatted.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/invitation-experience-e2e.yml \
            src/app/release-a-invitation-preview/page.tsx \
            tests/e2e/release-a-invitation-showroom.spec.ts
          git commit -m 'Format invitation review showroom'
          git push origin HEAD:agent/release-a-flagship-experience
