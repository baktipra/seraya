name: Invitation Workspace Editorial Redesign V1 validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/app/(dashboard)/dashboard/[projectId]/invitation/page.tsx'
      - 'src/components/projects/invitation-task-workspace.tsx'
      - 'src/components/projects/invitation-task-workspace.module.css'
      - 'src/components/projects/invitation-task-workspace.types.ts'
      - 'src/components/projects/invitation-studio-preview-rail.tsx'
      - 'src/components/projects/invitation-studio-preview-rail.module.css'
      - 'tests/unit/invitation-workspace-editorial-redesign-v1.test.ts'
      - 'tests/unit/owner-workspace-radical-simplicity-v2.test.ts'
      - 'tests/e2e/owner-workspace-radical-simplicity-v2.spec.ts'
      - 'tests/e2e/fixture-app/app/owner-workspace-radical-simplicity-v2/**'
      - 'tests/e2e/fixture-app/app/owner-workspace-usability-reset/**'
      - 'vercel.json'
      - '.github/workflows/invitation-workspace-editorial-redesign-v1.yml'
  push:
    branches:
      - feature/invitation-workspace-editorial-redesign-v1

concurrency:
  group: invitation-workspace-editorial-redesign-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full formatting check
        run: npm run format:check
      - name: Full lint
        run: npm run lint
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Full unit and server suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run editorial owner and invitation workspace regression
        run: npx playwright test --config=playwright.owner-workspace-radical-simplicity-v2.config.ts
      - name: Run accepted Slice D media compatibility smoke
        run: npx playwright test --config=playwright.invitation-studio-slice-d.config.ts
      - name: Run accepted Slice G responsive compatibility smoke
        run: npx playwright test --config=playwright.invitation-studio-slice-g.config.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-workspace-editorial-redesign-v1-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
