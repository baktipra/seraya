name: P0-A4 source snapshot once

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/p0-a4-readiness-aggregation-recovery]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source snapshot
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=.next -czf /tmp/seraya-p0-a4-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: seraya-p0-a4-source
          path: /tmp/seraya-p0-a4-source.tar.gz
          if-no-files-found: error
          retention-days: 1
