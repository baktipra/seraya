name: Invitation experience browser regression

on:
  pull_request:
    paths:
      - '.github/workflows/invitation-experience-e2e.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.invitation-experience.config.ts'
      - 'src/app/[slug]/**'
      - 'src/app/api/invitations/[slug]/audio/**'
      - 'src/app/invitation-maturation-release.css'
      - 'src/app/invitation-opening-maturation-release.css'
      - 'src/app/invitation-media-release.css'
      - 'src/app/layout.tsx'
      - 'src/app/release-a-invitation-preview/**'
      - 'src/components/invitation-audio-playback-control.*'
      - 'src/modules/invitation-templates/**'
      - 'src/modules/media/invitation-audio-playback.*'
      - 'src/modules/media/invitation-audio.repository.ts'
      - 'tests/e2e/invitation-experience.spec.ts'
      - 'tests/e2e/release-a-invitation-showroom.spec.ts'
      - 'tests/e2e/fixture-app/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/invitation-experience-e2e.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.invitation-experience.config.ts'
      - 'src/app/[slug]/**'
      - 'src/app/api/invitations/[slug]/audio/**'
      - 'src/app/invitation-maturation-release.css'
      - 'src/app/invitation-opening-maturation-release.css'
      - 'src/app/invitation-media-release.css'
      - 'src/app/layout.tsx'
      - 'src/app/release-a-invitation-preview/**'
      - 'src/components/invitation-audio-playback-control.*'
      - 'src/modules/invitation-templates/**'
      - 'src/modules/media/invitation-audio-playback.*'
      - 'src/modules/media/invitation-audio.repository.ts'
      - 'tests/e2e/invitation-experience.spec.ts'
      - 'tests/e2e/release-a-invitation-showroom.spec.ts'
      - 'tests/e2e/fixture-app/**'

permissions:
  contents: read

jobs:
  invitation-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check invitation experience formatting
        run: |
          npx prettier --check \
            .github/workflows/invitation-experience-e2e.yml \
            package.json \
            playwright.invitation-experience.config.ts \
            src/app/api/invitations/[slug]/audio/playback/route.ts \
            src/app/invitation-maturation-release.css \
            src/app/invitation-opening-maturation-release.css \
            src/app/invitation-media-release.css \
            src/app/layout.tsx \
            src/app/release-a-invitation-preview/page.tsx \
            src/components/invitation-audio-playback-control.tsx \
            src/components/invitation-audio-playback-control.module.css \
            src/modules/media/invitation-audio-playback.types.ts \
            src/modules/media/invitation-audio-playback.service.ts \
            src/modules/media/invitation-audio.repository.ts \
            src/modules/invitation-templates/invitation-gallery-image.tsx \
            src/modules/invitation-templates/roselle/roselle-sections.tsx \
            src/modules/invitation-templates/aruna/aruna-template.tsx \
            src/modules/invitation-templates/laras/laras-monogram.ts \
            src/modules/invitation-templates/laras/laras-template.tsx \
            src/modules/invitation-templates/__tests__/invitation-opening-identity-contract.test.ts \
            src/modules/invitation-templates/__tests__/invitation-media-delivery-contract.test.ts \
            tests/e2e/invitation-experience.spec.ts \
            tests/e2e/release-a-invitation-showroom.spec.ts \
            tests/e2e/fixture-app/app/layout.tsx \
            tests/e2e/fixture-app/lib/fixture-invitation.ts

      - name: Lint invitation experience files
        run: |
          npx eslint \
            playwright.invitation-experience.config.ts \
            src/app/api/invitations/[slug]/audio/playback/route.ts \
            src/app/layout.tsx \
            src/app/release-a-invitation-preview/page.tsx \
            src/components/invitation-audio-playback-control.tsx \
            src/modules/media/invitation-audio-playback.types.ts \
            src/modules/media/invitation-audio-playback.service.ts \
            src/modules/media/invitation-audio.repository.ts \
            src/modules/invitation-templates/invitation-gallery-image.tsx \
            src/modules/invitation-templates/roselle/roselle-sections.tsx \
            src/modules/invitation-templates/aruna/aruna-template.tsx \
            src/modules/invitation-templates/laras/laras-monogram.ts \
            src/modules/invitation-templates/laras/laras-template.tsx \
            src/modules/invitation-templates/__tests__/invitation-opening-identity-contract.test.ts \
            src/modules/invitation-templates/__tests__/invitation-media-delivery-contract.test.ts \
            tests/e2e/invitation-experience.spec.ts \
            tests/e2e/release-a-invitation-showroom.spec.ts \
            tests/e2e/fixture-app/app/layout.tsx \
            tests/e2e/fixture-app/lib/fixture-invitation.ts

      - name: Run invitation experience source contracts
        run: |
          npm test -- \
            src/modules/invitation-templates/__tests__/invitation-opening-identity-contract.test.ts \
            src/modules/invitation-templates/__tests__/invitation-media-delivery-contract.test.ts

      - name: Build production application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run cross-template invitation experience regression
        run: npm run e2e:invitation-experience

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-experience-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
