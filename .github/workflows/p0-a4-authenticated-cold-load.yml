name: P0-A4 authenticated cold-load evidence

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  measure:
    if: github.head_ref == 'agent/p0-a4-readiness-aggregation-recovery'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      P0_A4_BASE_URL: https://seraya-ie0cdstph-bakti-s-projects.vercel.app/?_vercel_share=ZoViPPNtalE5UX8YsOqBFFIEAW5VZsgi
      P0_A4_MEASURED_SHA: 6313012e737ca7fd1bb3c461815cbc96ca519e4f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture authenticated cold loads
        run: node scripts/measure-p0-a4-cold-loads.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-a4-authenticated-cold-load-evidence
          path: p0-a4-cold-load-evidence
          if-no-files-found: warn
          retention-days: 1
