name: V4J Slice A browser smoke

on:
  push:
    branches:
      - feature/v4j-invitation-atmosphere-couple-identity-v1
    paths:
      - '.github/workflows/v4j-slice-a-browser-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused Slice A source contract
        run: npx vitest run tests/unit/invitation-atmosphere-identity-v4j.test.tsx
      - name: Build production application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run cross-template invitation experience regression
        run: npm run e2e:invitation-experience
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4j-slice-a-browser-smoke
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
