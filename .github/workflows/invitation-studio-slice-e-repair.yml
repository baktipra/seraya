name: Repair Invitation Studio Slice E gates

on:
  push:
    branches:
      - feature/invitation-studio-slice-e-preview-version-truth-authority
    paths:
      - 'tools/repair-invitation-studio-slice-e.py'
      - '.github/workflows/invitation-studio-slice-e-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/invitation-studio-slice-e-preview-version-truth-authority
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused repairs
        run: python tools/repair-invitation-studio-slice-e.py
      - name: Remove temporary repair files
        run: |
          rm tools/repair-invitation-studio-slice-e.py
          rm .github/workflows/invitation-studio-slice-e-repair.yml
      - name: Format repaired files
        run: |
          npx prettier --write \
            src/components/projects/invitation-studio-preview-mode.tsx \
            src/modules/publications/__tests__/published-invitation.schema.test.ts
      - name: Verify repaired gates
        run: |
          npx eslint src/components/projects/invitation-studio-preview-mode.tsx
          npm run typecheck
          npx vitest run \
            tests/unit/invitation-studio-preview-mode-slice-e.test.ts \
            src/modules/publications/__tests__/published-invitation.schema.test.ts
      - name: Commit focused repairs
        run: |
          git config user.name "seraya-release-bot"
          git config user.email "88146860+baktipra@users.noreply.github.com"
          git add -A
          git commit -m "SERAYA Slice E: repair preview and publication fixtures"
          git push origin HEAD:feature/invitation-studio-slice-e-preview-version-truth-authority
