name: Release A showroom format

on:
  push:
    branches:
      - agent/release-a-flagship-experience

permissions:
  contents: write

jobs:
  format-showroom:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-a-flagship-experience

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Keep one main landmark in showroom
        run: >-
          python -c "from pathlib import Path; p=Path('src/app/release-a-preview/page.tsx');
          s=p.read_text(); s=s.replace('      <main>', '      <div>', 1).replace('      </main>',
          '      </div>', 1); p.write_text(s)"

      - name: Format showroom scope
        run: |
          npx prettier --write \
            .github/workflows/release-a-regression.yml \
            src/app/release-a-preview/page.tsx \
            tests/e2e/marketing-home.spec.ts

      - name: Commit canonical showroom
        run: |
          if git diff --quiet; then
            echo 'Release A showroom already canonical.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/release-a-regression.yml \
            src/app/release-a-preview/page.tsx \
            tests/e2e/marketing-home.spec.ts
          git commit -m 'Format Release A preview showroom'
          git push origin HEAD:agent/release-a-flagship-experience
