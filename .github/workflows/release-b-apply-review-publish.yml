name: Release B apply review integration

on:
  push:
    branches:
      - agent/release-b-create-to-publish

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Mount Release B readiness review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-b-create-to-publish
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Mount review panel in production editor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/projects/invitation-editor.tsx')
          source = path.read_text()

          exact = [
              (
                  "import { InvitationEditorLivePreview } from './invitation-editor-live-preview';\n",
                  "import { InvitationEditorLivePreview } from './invitation-editor-live-preview';\nimport { InvitationEditorReviewPanel } from './invitation-editor-review-panel';\n",
              ),
              (
                  "  const [isLocalPreviewOpen, setIsLocalPreviewOpen] = useState(false);\n",
                  "  const [isLocalPreviewOpen, setIsLocalPreviewOpen] = useState(false);\n  const [isReviewOpen, setIsReviewOpen] = useState(false);\n",
              ),
              (
                  "          projectId={projectId}\n          templateLabel={content.templateKey}\n",
                  "          onReview={() => setIsReviewOpen(true)}\n          projectId={projectId}\n          templateLabel={content.templateKey}\n",
              ),
          ]

          for old, new in exact:
              if new in source:
                  continue
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one exact match, found {count}: {old[:100]!r}')
              source = source.replace(old, new)

          mount = """      <InvitationEditorReviewPanel
        coupleLabel={workspaceReadiness.identity.coupleLabel}
        galleryCount={content.gallery.imageIds.length}
        isDirty={isDirty}
        onClose={() => setIsReviewOpen(false)}
        onEditChapter={handleSectionSelect}
        open={isReviewOpen}
        projectId={projectId}
        publishEligibility={getInvitationPublishEligibility(workspaceReadiness)}
        statuses={sectionStatuses}
        templateLabel={content.templateKey}
        truth={truthState}
        workspaceReadiness={workspaceReadiness}
      />
"""
          if mount not in source:
              marker = "      </Card>\n    </div>\n"
              count = source.count(marker)
              if count != 1:
                  raise SystemExit(f'Expected one editor close marker, found {count}')
              source = source.replace(marker, "      </Card>\n" + mount + "    </div>\n")

          path.write_text(source)
          PY

      - name: Format mounted review
        run: |
          npx prettier --write \
            src/components/projects/invitation-editor.tsx \
            src/components/projects/invitation-editor-review-panel.tsx \
            src/components/projects/invitation-editor-status-header.tsx

      - name: Commit mounted review
        run: |
          if git diff --quiet; then
            echo 'Review already mounted.'
            exit 0
          fi
          git config user.name 'seraya-release-b-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/components/projects/invitation-editor.tsx \
            src/components/projects/invitation-editor-review-panel.tsx \
            src/components/projects/invitation-editor-status-header.tsx
          git commit -m 'Mount Release B readiness review'
          git push origin HEAD:agent/release-b-create-to-publish
