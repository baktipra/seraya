name: V4I temporary Story photo formatting

on:
  push:
    branches:
      - feature/v4i-remote-attendance-public-social-share-v1
    paths:
      - '.github/workflows/v4i-photo-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/v4i-remote-attendance-public-social-share-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Story photo scope
        run: |
          npx prettier --write \
            src/modules/public-social-share/public-social-share.core.ts \
            src/modules/public-social-share/public-social-share.service.ts \
            'src/app/api/projects/[projectId]/public-share/story/route.tsx' \
            src/components/projects/public-social-share-kit.tsx \
            tests/unit/public-social-share-v4i.test.ts

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "SERAYA V4I: format published Story photo scope"
          git push origin HEAD:feature/v4i-remote-attendance-public-social-share-v1
