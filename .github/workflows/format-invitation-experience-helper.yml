name: Format invitation experience layer

on:
  push:
    branches:
      - agent/release-a-flagship-experience

permissions:
  contents: write

jobs:
  format-invitation-experience:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-a-flagship-experience

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format invitation experience scope
        run: |
          npx prettier --write \
            .github/workflows/invitation-experience-e2e.yml \
            package.json \
            playwright.invitation-experience.config.ts \
            src/app/invitation-maturation-release.css \
            src/app/layout.tsx \
            tests/e2e/invitation-experience.spec.ts \
            tests/e2e/fixture-app/lib/fixture-invitation.ts

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo 'Invitation experience files are already formatted.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/invitation-experience-e2e.yml \
            package.json \
            playwright.invitation-experience.config.ts \
            src/app/invitation-maturation-release.css \
            src/app/layout.tsx \
            tests/e2e/invitation-experience.spec.ts \
            tests/e2e/fixture-app/lib/fixture-invitation.ts
          git commit -m 'Format invitation experience maturation layer'
          git push origin HEAD:agent/release-a-flagship-experience
