name: P0-A5 corrected production runtime evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  measure:
    if: github.head_ref == 'agent/p0-a5-editor-runtime-recovery'
    runs-on: ubuntu-latest
    env:
      BEFORE_SHA: eba8bdbc0ed0b3f7aed5c6ea5d5a41467d4ab535
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Prepare identical fixture on both revisions
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/seraya-before "$BEFORE_SHA"
          rm -rf /tmp/seraya-before/tests/e2e/editor-runtime-fixture
          cp -R tests/e2e/editor-runtime-fixture /tmp/seraya-before/tests/e2e/editor-runtime-fixture
          (
            cd /tmp/seraya-before
            npm ci
          )

      - name: Build both fixture apps in production mode
        shell: bash
        run: |
          set -euo pipefail
          npx next build tests/e2e/editor-runtime-fixture
          (
            cd /tmp/seraya-before
            npx next build tests/e2e/editor-runtime-fixture
          )

      - name: Start both production fixture apps
        shell: bash
        run: |
          set -euo pipefail
          nohup npx next start tests/e2e/editor-runtime-fixture -p 3102 > /tmp/a5-after.log 2>&1 &
          (
            cd /tmp/seraya-before
            nohup npx next start tests/e2e/editor-runtime-fixture -p 3101 > /tmp/a5-before.log 2>&1 &
          )
          for port in 3101 3102; do
            for attempt in $(seq 1 60); do
              if curl --fail --silent "http://127.0.0.1:${port}" > /dev/null; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                cat /tmp/a5-before.log || true
                cat /tmp/a5-after.log || true
                exit 1
              fi
              sleep 1
            done
          done

      - name: Measure desktop and Pixel 7
        run: node scripts/measure-p0-a5-runtime-evidence.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: p0-a5-production-runtime-evidence
          path: p0-a5-runtime-evidence
          retention-days: 1
