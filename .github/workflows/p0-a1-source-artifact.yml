name: P0-A1 source artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: p0-a1-source
          path: |
            .github
            docs
            scripts
            src
            tests
            package.json
            package-lock.json
            playwright*.ts
            next.config.*
            tsconfig.json
            vitest.config.*
          retention-days: 1
