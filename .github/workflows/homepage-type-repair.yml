name: Homepage type repair

on:
  push:
    branches:
      - agent/homepage-flagship-maturity-v1

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[homepage-type-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/homepage-flagship-maturity-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair CSS module class typing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/marketing/flagship-marketing.tsx')
          content = path.read_text()
          content = content.replace('roselle: styles.roselle,', "roselle: styles.roselle ?? '',")
          content = content.replace('aruna: styles.aruna,', "aruna: styles.aruna ?? '',")
          content = content.replace('laras: styles.laras,', "laras: styles.laras ?? '',")
          path.write_text(content)
          PY
          npx prettier --write src/components/marketing/flagship-marketing.tsx

      - name: Validate focused files
        run: |
          npx prettier --check src/components/marketing/flagship-marketing.tsx src/components/marketing/flagship-marketing.module.css tests/e2e/homepage-product-theater.spec.ts
          npx eslint src/components/marketing/flagship-marketing.tsx tests/e2e/homepage-product-theater.spec.ts
          npm run typecheck

      - name: Commit repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/marketing/flagship-marketing.tsx
          git commit -m "SERAYA — Repair homepage CSS module typing [homepage-type-repaired]"
          git push origin HEAD:agent/homepage-flagship-maturity-v1
