name: V4J Slice C guest playback implementation

on:
  push:
    branches:
      - feature/v4j-invitation-atmosphere-couple-identity-v1
    paths:
      - '.github/workflows/v4j-slice-c-apply.yml'

permissions:
  contents: write

jobs:
  implement-guest-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/v4j-invitation-atmosphere-couple-identity-v1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Correct Slice C editor anchor
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('scripts/v4j-slice-c-apply.py')
          content = path.read_text()
          old = '  const [previewContent, setPreviewContent] = useState(content);'
          new = '  const [previewContent, setPreviewContent] = useState(draft.content);'
          if old not in content:
              raise SystemExit('Slice C preview-content anchor was not found.')
          path.write_text(content.replace(old, new, 1))
          PY
      - name: Apply Slice C source changes
        run: python scripts/v4j-slice-c-apply.py
      - name: Apply focused React fixes
        run: |
          python <<'PY'
          from pathlib import Path

          preview = Path('src/components/projects/invitation-editor-live-preview.tsx')
          preview_content = preview.read_text()
          preview_content = preview_content.replace(
              "  type InvitationAudioChangedEventDetail,\n",
              "",
              1,
          )
          preview.write_text(preview_content)

          editor = Path('src/components/projects/invitation-editor.tsx')
          editor_content = editor.read_text()
          effect = """  useEffect(() => {
    setPreviewAudio(draft.content.audio);
  }, [draft.content.audio]);

"""
          if effect not in editor_content:
              raise SystemExit('Preview audio synchronization effect was not found.')
          editor.write_text(editor_content.replace(effect, '', 1))
          PY
      - name: Format Slice C source
        run: |
          npx prettier --write \
            src/app/api/invitations/[slug]/audio/playback/route.ts \
            src/app/api/projects/[projectId]/audio/playback/route.ts \
            'src/app/(dashboard)/dashboard/[projectId]/preview/page.tsx' \
            src/app/[slug]/page.tsx \
            src/app/[slug]/g/[guestToken]/page.tsx \
            src/components/invitation-audio-playback-control.tsx \
            src/components/invitation-audio-playback-control.module.css \
            src/components/projects/invitation-audio-manager.tsx \
            src/components/projects/invitation-editor.tsx \
            src/components/projects/invitation-editor-live-preview.tsx \
            src/modules/invitation-templates/invitation-template-renderer.tsx \
            src/modules/media/invitation-audio-playback.types.ts \
            src/modules/media/invitation-audio-playback.service.ts \
            src/modules/media/invitation-audio.repository.ts \
            tests/unit/invitation-audio-playback-v4j.test.ts
      - name: Validate Slice C source
        run: |
          npx eslint \
            src/app/api/invitations/[slug]/audio/playback/route.ts \
            src/app/api/projects/[projectId]/audio/playback/route.ts \
            'src/app/(dashboard)/dashboard/[projectId]/preview/page.tsx' \
            src/app/[slug]/page.tsx \
            src/app/[slug]/g/[guestToken]/page.tsx \
            src/components/invitation-audio-playback-control.tsx \
            src/components/projects/invitation-audio-manager.tsx \
            src/components/projects/invitation-editor.tsx \
            src/components/projects/invitation-editor-live-preview.tsx \
            src/modules/invitation-templates/invitation-template-renderer.tsx \
            src/modules/media/invitation-audio-playback.types.ts \
            src/modules/media/invitation-audio-playback.service.ts \
            src/modules/media/invitation-audio.repository.ts \
            tests/unit/invitation-audio-playback-v4j.test.ts
          npm run typecheck
          npx vitest run \
            tests/unit/invitation-audio-playback-v4j.test.ts \
            tests/unit/invitation-audio-media-v4j.test.ts \
            tests/unit/invitation-atmosphere-identity-v4j.test.tsx \
            src/modules/publications/__tests__/publication.service.test.ts
          npm run build
      - name: Commit validated Slice C source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests/unit/invitation-audio-playback-v4j.test.ts
          git commit -m "SERAYA V4J: implement guest playback and atmosphere Slice C"
          git push origin HEAD:feature/v4j-invitation-atmosphere-couple-identity-v1
